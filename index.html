<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IntelDeck</title>
<style>
:root{
  --bg:#02050d;
  --uia:1;
  --uiz:1;
  --panel:rgba(5,18,38,calc(.78*var(--uia)));
  --panel2:rgba(8,28,58,calc(.85*max(var(--uia),.6)));
  --cyan:#4df2ff;
  --blue:#2b8cff;
  --deep:#0b3a78;
  --cyan-rgb:77,242,255;
  --blue-rgb:43,140,255;
  --amber:#ffb347;
  --red:#ff4d5e;
  --green:#4dffa8;
  --text:#cfeaff;
  --dim:#6f8fb3;
  --glow:0 0 12px rgba(var(--cyan-rgb),.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Eurostile,"Bank Gothic","Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(var(--cyan-rgb),.035) 0,rgba(var(--cyan-rgb),.035) 1px,transparent 1px,transparent 3px)}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:linear-gradient(180deg,rgba(var(--blue-rgb),.25),rgba(11,58,120,.35));border:1px solid var(--blue);color:var(--cyan);padding:8px 16px;text-transform:uppercase;letter-spacing:.14em;font-size:.78rem;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:background .15s,box-shadow .15s,color .15s}
.btn:hover,.btn:focus-visible{background:linear-gradient(180deg,rgba(var(--cyan-rgb),.35),rgba(var(--blue-rgb),.45));color:#fff;box-shadow:var(--glow);outline:none}
.btn:active{transform:translateY(1px)}
.btn.amber{border-color:var(--amber);color:var(--amber)}
.btn.amber:hover,.btn.amber:focus-visible{background:rgba(255,179,71,.3);color:#fff;box-shadow:0 0 12px rgba(255,179,71,.5)}
#title{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;background:radial-gradient(ellipse at center,rgba(2,10,24,.35),rgba(2,5,13,.85));transition:opacity .8s ease,visibility .8s}
#title.gone{opacity:0;visibility:hidden;pointer-events:none}
#login{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at center,rgba(2,10,24,.45),rgba(2,5,13,.9));transition:opacity .4s ease,visibility .4s;overflow:auto}
#login.gone{opacity:0;visibility:hidden;pointer-events:none}
.loginbox{width:min(420px,100%);max-height:calc(94vh/var(--uiz));overflow:auto}
.loginbox .lglinks{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.logo{font-size:clamp(2rem,7vw,4.6rem);letter-spacing:.35em;margin:0 0 6px .35em;color:var(--cyan);text-shadow:0 0 18px rgba(var(--cyan-rgb),.8),0 0 48px rgba(var(--blue-rgb),.6);font-weight:700}
.bootlog{min-height:96px;font-family:Consolas,"Courier New",monospace;font-size:.8rem;color:var(--green);text-align:left;margin:20px 0 24px}
.bootlog div{opacity:0;animation:fadeLine .3s forwards}
@keyframes fadeLine{to{opacity:1}}
#start{font-size:1rem;padding:14px 38px;animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 6px rgba(var(--cyan-rgb),.3)}50%{box-shadow:0 0 22px rgba(var(--cyan-rgb),.8)}}
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;opacity:0;transition:opacity .8s ease .2s}
#app.live{opacity:1}
header.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:linear-gradient(180deg,rgba(8,28,58,calc(.9*var(--uia))),rgba(5,18,38,calc(.6*var(--uia))));border-bottom:1px solid var(--blue);box-shadow:0 2px 18px rgba(var(--blue-rgb),.25);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:1.15rem;letter-spacing:.3em;color:var(--cyan);text-shadow:var(--glow)}
.brand span{font-size:.7rem;color:var(--amber);letter-spacing:.15em}
.spacer{flex:1}
.clock{font-family:Consolas,"Courier New",monospace;text-align:right;line-height:1.2}
.clock .t{font-size:1.1rem;color:var(--cyan)}
.clock .d{font-size:.68rem;color:var(--dim);letter-spacing:.1em}
nav.tabs{display:flex;gap:6px;padding:10px 18px 0;overflow-x:auto;scrollbar-width:thin}
.tab{flex:0 0 auto;padding:9px 20px;background:rgba(5,18,38,calc(.7*var(--uia)));border:1px solid var(--deep);border-bottom:none;color:var(--dim);text-transform:uppercase;letter-spacing:.16em;font-size:.76rem;clip-path:polygon(12px 0,100% 0,100% 100%,0 100%,0 12px);transition:color .15s,background .15s}
.tab:hover,.tab:focus-visible{color:var(--cyan);outline:none;background:rgba(11,58,120,.5)}
.tab.active{color:#fff;background:linear-gradient(180deg,rgba(var(--blue-rgb),.45),rgba(11,58,120,.55));border-color:var(--cyan);box-shadow:0 -2px 12px rgba(var(--cyan-rgb),.35)}
main{flex:1;overflow:auto;padding:18px;border-top:1px solid var(--cyan);margin-top:0;background:linear-gradient(180deg,rgba(5,18,38,.45),rgba(2,5,13,.2))}
.view{display:none;animation:rise .35s ease}
.view.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ic{font-style:normal;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.tick{overflow:hidden;white-space:nowrap}
.trk{display:flex;width:max-content;animation:tkx var(--dur,20s) linear infinite}
.tick:hover .trk,.vscroll:hover .vtrk{animation-play-state:paused}
.trkset{display:flex;gap:30px;padding-right:30px}
.tk{font-family:Consolas,"Courier New",monospace;font-size:.9rem;color:var(--text)}
.tk b{color:var(--cyan)}
.tk em{font-style:normal;font-size:.78rem;margin-left:4px}
.tk em.gain{color:var(--green)}
.tk em.loss{color:var(--red)}
.tk i{font-style:normal;color:var(--dim);font-size:.7rem;text-transform:uppercase;letter-spacing:.1em}
@keyframes tkx{to{transform:translateX(-50%)}}
.vscroll.run{height:132px;overflow:hidden}
.vtrk{animation:tky var(--dur,20s) linear infinite}
@keyframes tky{to{transform:translateY(-50%)}}
.plr{display:block;padding:6px 0;border-bottom:1px dashed rgba(var(--blue-rgb),.2)}
.plr .lb{display:block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.plr .ti{display:block;font-size:.92rem;word-break:break-word}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.panel{position:relative;background:var(--panel);border:1px solid var(--deep);padding:16px 18px 18px;clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.panel::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),transparent 70%)}
.setgrid{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.setbtn{display:flex;align-items:center;gap:12px;text-align:left;min-width:200px;padding:12px 16px}
.setbtn .ic{font-size:1.6rem;line-height:1}
.setbtn .stx{display:flex;flex-direction:column;gap:2px}
.setbtn .stt{font-size:.82rem;letter-spacing:.16em;text-transform:uppercase}
.setbtn .bsub{font-size:.7rem;letter-spacing:.06em;color:var(--dim);text-transform:none}
.setbtn .bsub:empty{display:none}
#modalBody>.panel[data-sp]{background:none;border:0;padding:0;clip-path:none}
#modalBody>.panel[data-sp]::before{display:none}
#modalBody>.panel[data-sp]>h2{display:none}
.panel h2{margin:0 0 12px;font-size:.82rem;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan)}
.panel p{margin:0 0 10px;line-height:1.55;font-size:.9rem}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed rgba(var(--blue-rgb),.25);font-size:.85rem}
.stat span:first-child{color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-size:.74rem}
.stat span:last-child{font-family:Consolas,"Courier New",monospace;color:var(--cyan)}
.offline{text-align:center;padding:46px 12px}
.offline .big{font-size:1.5rem;letter-spacing:.3em;color:var(--amber);margin-bottom:10px;text-shadow:0 0 14px rgba(255,179,71,.5)}
.offline p{color:var(--dim)}
#modalWrap{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(2,5,13,calc(.78*max(var(--uia),.5)))}
#modalWrap.open{display:flex}
.modal{width:min(760px,100%);max-height:calc(88vh/var(--uiz));display:flex;flex-direction:column;background:var(--panel2);border:1px solid var(--cyan);box-shadow:0 0 30px rgba(var(--cyan-rgb),.3);clip-path:polygon(20px 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%,0 20px);animation:rise .25s ease}
#verPop{position:fixed;left:0;right:0;margin:0 auto;top:14px;z-index:95;width:min(440px,calc(100% - 24px));display:none;background:var(--panel2);border:1px solid var(--amber);box-shadow:0 0 30px rgba(255,179,71,.35);padding:14px 18px;line-height:1.5;font-size:.88rem;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);animation:rise .25s ease}
#verPop.open{display:block}
#verPop b{display:block;color:var(--amber);letter-spacing:.2em;text-transform:uppercase;font-size:.8rem;margin-bottom:6px}
#verPop p{margin:0 0 10px}
#verPop .acts{display:flex;gap:10px;flex-wrap:wrap}
.updchk{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.updchk span{color:var(--dim);font-size:.8rem}
.modal header{display:flex;align-items:center;padding:14px 22px;border-bottom:1px solid var(--blue);gap:12px}
.modal header h2{margin:0;flex:1;font-size:1rem;letter-spacing:.28em;text-transform:uppercase;color:var(--cyan)}
.modal .body{overflow:auto;padding:18px 24px 24px;line-height:1.6;font-size:.92rem}
.modal h3{margin:20px 0 8px;font-size:.82rem;letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}
.modal h3:first-child{margin-top:0}
.modal ul{margin:0 0 8px;padding-left:20px}
.modal li{margin-bottom:4px}
.modal kbd{font-family:Consolas,"Courier New",monospace;background:rgba(2,10,24,.8);border:1px solid var(--blue);padding:1px 6px;font-size:.8rem;color:var(--cyan)}
.upd{border-left:3px solid var(--cyan);padding:2px 0 2px 14px;margin-bottom:18px}
.upd .vh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.upd .vh b{color:var(--cyan);letter-spacing:.14em}
.upd .vh span{color:var(--dim);font-size:.76rem;font-family:Consolas,"Courier New",monospace}
*{scrollbar-width:thin;scrollbar-color:var(--blue) rgba(2,10,24,.85)}
@supports not (scrollbar-color:auto){
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:rgba(2,10,24,.85)}
  ::-webkit-scrollbar-thumb{background:var(--blue);border:1px solid var(--cyan)}
  ::-webkit-scrollbar-thumb:hover{background:var(--cyan)}
  ::-webkit-scrollbar-corner{background:rgba(2,10,24,.85)}
}
input[type=range]{-webkit-appearance:none;appearance:none;height:20px;background:transparent;cursor:pointer;margin:0;padding:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:rgba(2,10,24,.9);border:1px solid var(--deep)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;margin-top:-5px;background:var(--cyan);border:0;box-shadow:0 0 8px rgba(var(--cyan-rgb),.7);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
input[type=range]::-moz-range-track{height:8px;background:rgba(2,10,24,.9);border:1px solid var(--deep)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;background:var(--cyan);border:0;border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
input[type=range]::-moz-range-progress{height:8px;background:var(--blue)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 12px var(--cyan)}
.volrow{display:flex;align-items:center;gap:12px}
.volrow input[type=range]{flex:1}
.volrow output{font-family:Consolas,"Courier New",monospace;font-size:.85rem;color:var(--cyan);min-width:44px;text-align:right}
@media (max-width:640px){
  .brand h1{font-size:.95rem;letter-spacing:.2em}
  .spacer{display:none}
  header.top{gap:8px}
  .clock{margin-left:auto}
  main{padding:12px}
}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:130px}
.field label{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],select{font:inherit;color:var(--text);background:rgba(2,10,24,.85);border:1px solid var(--deep);padding:8px 10px;font-size:.88rem;width:100%;color-scheme:dark;border-radius:0}
input[type=text]:focus,input[type=email]:focus,input[type=password]:focus,input[type=date]:focus,input[type=time]:focus,select:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 8px rgba(var(--cyan-rgb),.35)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.stack{margin-top:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.btn.mini{padding:4px 10px;font-size:.68rem;letter-spacing:.1em;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.chip{background:rgba(2,10,24,.7);border:1px solid var(--deep);color:var(--dim);padding:5px 12px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.chip span{color:var(--cyan);margin-left:4px}
.chip:hover,.chip:focus-visible{color:var(--cyan);outline:none;border-color:var(--blue)}
.chip.active{color:#fff;border-color:var(--cyan);background:rgba(var(--blue-rgb),.35)}
.empty{color:var(--dim);font-size:.85rem;margin:6px 0}
.todo{display:flex;align-items:center;gap:10px;padding:9px 10px;background:rgba(2,10,24,.6);border-left:3px solid var(--blue);margin-bottom:6px;flex-wrap:wrap}
.todo.p-high{border-left-color:var(--red)}
.todo.p-med{border-left-color:var(--amber)}
.todo.p-low{border-left-color:var(--blue)}
.todo input[type=checkbox]{width:18px;height:18px;accent-color:var(--cyan);flex:0 0 auto;cursor:pointer}
.todo .tx{flex:1 1 160px;word-break:break-word;font-size:.9rem}
.todo.done .tx{text-decoration:line-through;color:var(--dim)}
.tag.rep{border-color:var(--cyan,#2ee6ff);color:var(--cyan,#2ee6ff)}
.wdrow{display:flex;flex-wrap:wrap;gap:6px}
.wdchk{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--deep);padding:4px 8px;font-size:.78rem;cursor:pointer}
#brain{display:block;width:100%;max-width:279px;margin:0 auto 12px;image-rendering:pixelated}
.todo .pri{font-size:.62rem;letter-spacing:.14em;color:var(--dim);border:1px solid var(--deep);padding:1px 6px}
.todo .due{font-family:Consolas,"Courier New",monospace;font-size:.72rem;color:var(--dim)}
.todo .due.over{color:var(--red)}
.todo .due.today{color:var(--amber)}
.todo.edit input[type=text]{flex:1 1 200px;width:auto}
.todo.edit select,.todo.edit input[type=date]{width:auto}
.cal-layout{display:grid;gap:16px;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);align-items:start}
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-head h3{flex:1;margin:0;text-align:center;letter-spacing:.22em;font-size:.95rem;color:var(--cyan);text-shadow:var(--glow)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow{text-align:center;font-size:.66rem;letter-spacing:.14em;color:var(--dim);padding:4px 0;text-transform:uppercase}
.cal-day{min-height:64px;padding:4px 6px;background:rgba(2,10,24,.6);border:1px solid rgba(var(--blue-rgb),.2);text-align:left;display:flex;flex-direction:column;gap:4px;transition:background .15s,border-color .15s}
.cal-day:hover,.cal-day:focus-visible{background:rgba(11,58,120,.45);border-color:var(--blue);outline:none}
.cal-day.out{opacity:.4}
.cal-day.today{border-color:var(--amber)}
.cal-day.sel{border-color:var(--cyan);background:rgba(var(--blue-rgb),.28);box-shadow:inset 0 0 10px rgba(var(--cyan-rgb),.3)}
.cal-day .n{font-size:.8rem;font-family:Consolas,"Courier New",monospace}
.cal-day.today .n{color:var(--amber)}
.dots{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cyan)}
.dot.t{background:var(--amber);border-radius:0}
.dots .ct{font-size:.62rem;color:var(--dim)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:12px;font-size:.72rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.legend .dot{margin-right:4px}
.evrow{display:flex;align-items:center;gap:10px;padding:8px 10px;background:rgba(2,10,24,.6);border-left:3px solid var(--cyan);margin-bottom:6px;flex-wrap:wrap}
.evrow.task{border-left-color:var(--amber)}
.evrow .tm{font-family:Consolas,"Courier New",monospace;font-size:.7rem;color:var(--cyan);min-width:62px}
.evrow.task .tm{color:var(--amber)}
.evrow .tx{flex:1 1 120px;font-size:.88rem;word-break:break-word}
.evrow .tx small{display:block;color:var(--dim);font-size:.74rem;margin-top:2px}
.evrow.edit{display:grid;gap:8px}
.evrow .pair{display:flex;gap:8px}
.up{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:7px 10px;margin-bottom:6px;background:rgba(2,10,24,.6);border:0;border-left:3px solid var(--blue);font-size:.82rem;flex-wrap:wrap}
.up:hover,.up:focus-visible{background:rgba(11,58,120,.45);outline:none}
.up .d{font-family:Consolas,"Courier New",monospace;color:var(--cyan);font-size:.72rem}
.up .tm{color:var(--dim);font-size:.72rem}
.up .tx{flex:1 1 100%}
.stat span.warn{color:var(--red)}
@media (max-width:900px){
  .cal-layout{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .cal-day{min-height:48px;padding:3px 4px}
  .cal-head h3{font-size:.8rem;letter-spacing:.12em}
}
textarea{font:inherit;color:var(--text);background:rgba(2,10,24,.85);border:1px solid var(--deep);padding:8px 10px;font-size:.9rem;width:100%;min-height:200px;resize:vertical;line-height:1.5;color-scheme:dark;border-radius:0}
textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 8px rgba(var(--cyan-rgb),.35)}
.split{display:grid;gap:16px;grid-template-columns:minmax(260px,1fr) minmax(0,1.6fr);align-items:start}
.form{display:grid;gap:12px}
.form .pair{display:flex;gap:10px;flex-wrap:wrap}
.form .meta{font-size:.72rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.item{display:block;width:100%;text-align:left;padding:9px 12px;margin-bottom:6px;background:rgba(2,10,24,.6);border:0;border-left:3px solid var(--deep);transition:background .15s,border-color .15s}
.item:hover,.item:focus-visible{background:rgba(11,58,120,.45);outline:none}
.item.sel{border-left-color:var(--cyan);background:rgba(var(--blue-rgb),.25)}
.item .t{display:block;font-size:.92rem;color:var(--text);word-break:break-word}
.item .s{display:block;font-size:.76rem;color:var(--dim);margin-top:3px;word-break:break-word}
.item .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:.62rem;letter-spacing:.1em;padding:1px 6px;border:1px solid var(--blue);color:var(--cyan);text-transform:uppercase}
.item .dt{float:right;font-family:Consolas,"Courier New",monospace;font-size:.66rem;color:var(--dim);margin-left:8px}
.item .bd{color:var(--green)}
.chipbox{display:flex;gap:6px;flex-wrap:wrap;min-height:6px}
.tg{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;letter-spacing:.08em;padding:2px 4px 2px 8px;border:1px solid var(--blue);color:var(--cyan);text-transform:uppercase;background:rgba(var(--blue-rgb),.12)}
.tg button{background:none;border:0;color:var(--dim);cursor:pointer;font:inherit;padding:0 4px}
.tg button:hover,.tg button:focus-visible{color:var(--red);outline:none}
.rlrow{display:flex;align-items:center;gap:8px;font-size:.84rem;padding:4px 0;border-bottom:1px dashed rgba(var(--blue-rgb),.2)}
.rlrow span{flex:1;word-break:break-word}

    "New: every date you fill in creates a repeating task: oil change every 6 months, wipers and air filter every 12, tires every 5 years, brake fluid and antifreeze checks every 2 years, registration every year. A loan creates a monthly Pay loan task.",
    "New: finishing a maintenance task records today as the new last-done date, asks for the date and odometer, and schedules the next one. Finishing a loan payment lowers the balance; at zero the payments stop. Un-finishing a task puts the old value back.",
    "Improved: Edit a vehicle to change dates or amounts and its open tasks update. Deleting a vehicle removes its open tasks. Backups, restore, erase, Intel and Settings counts include assets. Help updated."
  ]},
  {v:"0.22.0",d:"2026-10-08 09:30 PDT",items:[
    "New: a yearly File taxes task is added for you automatically, due April 15, high priority, tagged taxes, and set to repeat every year. When you finish it, next year's appears. It is added once; edit or delete it like any task and it will not come back.",
    "New: Settings has an Automatic Tasks box with a checkbox for it. Unticking stops it being added in future. Ticking it again adds the task if you have no open File taxes task.",
    "Improved: backups keep this setting and whether the task was added. Help updated."
  ]},
  {v:"0.21.0",d:"2026-10-08 09:00 PDT",items:[
    "New: pictures in Entertainment. Every item in Playing, Shelved and Completed now has a small pixel-art icon drawn from its title, so the same title always gets the same icon. The colors follow your Color Theme.",
    "New: optional Wikipedia thumbnails. In Settings, under Entertainment Pictures, choose None, Pixel icons or Wikipedia thumbnails. Thumbnails look the title up online, are saved on your device so each title is looked up once, and fall back to the pixel icon when nothing is found or you are offline.",
    "New: Clear Saved Thumbnails in Settings. Backups keep your picture choice.",
    "Improved: Help updated."
  ]},
  {v:"0.20.1",d:"2026-10-08 08:30 PDT",items:[
    "Changed: the Is this you? box in the person editor now hides when another person is already marked as you. It stays on your own entry so you can unmark it, and shows on everyone while nobody is marked.",
    "Changed: your entry no longer jumps to the top of the People list. It sorts like everyone else and keeps its Me tag.",
    "Improved: Help updated."
  ]},
  {v:"0.20.0",d:"2026-10-08 08:10 PDT",items:[
    "New: Your Entry. The first time you open the People tab, and any time no entry is marked as you, a window asks you to fill one in. Choose Fill In Now, pick yourself from your people with That Is Me, or press Not Now (it asks again next time you open People).",
    "New: your entry is marked Me, always sorts first in People, and can be changed any time with the Is this you? box in the person editor. Only one entry can be you.",
    "New: Religion for people. It is in the person editor and the New Person window, shows in the list, and is searchable. Suggestions come from religions you already entered.",
    "New: Scribe Data can ask for a person's religion. Turn it off in Settings under Scribe Data Questions, or press Never Ask This on a question.",
    "Improved: religion counts toward Intel. Backups keep religion and which entry is you. Help updated."
  ]},
  {v:"0.19.1",d:"2026-10-08 07:30 PDT",items:[
    "New: Color Theme in Settings. Pick the accent color from seven presets (cyan, green, amber, magenta, red, violet, white) or choose any custom color. Borders, glows, buttons, highlights and the starfield glow follow it. Back to Cyan restores the original look.",
    "Improved: your color is remembered and included in backups. Fixed the Calendar legend running off the screen on narrow phones. Help updated."
  ]},
  {v:"0.19.0",d:"2026-10-08 07:05 PDT",items:[
    "New: holidays on the Calendar. Seven groups: US federal holidays (on their plain dates), other well-known days (Valentine's Day, Easter, Mother's Day, Halloween, daylight saving changes and more), Christian, Jewish, Islamic, Hindu and Sikh, and Lunar New Year.",
    "New: holidays show as violet markers, in the day list, in Upcoming, and as fillers in Next Events on the Bridge after birthdays when you have few events.",
    "New: you can remove holidays from showing. Press Hide on any holiday in the day list, use the Holidays button under the calendar to turn them all off, or open Settings, then Holidays, to turn off whole groups or individual holidays. Show Every Holiday Again brings them all back.",
    "Note: Islamic, Hindu (Holi and Diwali) and Lunar New Year dates are calculated from the moon and can be a day off in some places. Jewish holidays are the first full day.",
    "Improved: backups keep your holiday choices. Help updated."
  ]},
  {v:"0.18.0",d:"2026-10-08 06:20 PDT",items:[
    "New: repeating events. In the event window pick Repeat: every X days, weeks (on the days you choose), months (same day, same weekday or last weekday) or years, the same choices as repeating tasks.",
    "New: a repeating event shows on every matching day of the calendar, in Upcoming and in Next Events on the Bridge, with a repeat note in the day list. Deleting it removes the whole series.",
    "Changed: Edit on an event now opens the event window, so every field including Repeat can be changed in one place.",
    "Fixed: a task or event that repeats monthly on the 31st (or the 5th weekday) now returns to that day after a short month instead of staying on the 28th.",
    "Improved: Help updated."
  ]},
  {v:"0.17.0",d:"2026-10-08 05:55 PDT",items:[
    "New: people have a Gender field with two choices, Male and Female. It is blank until you set it. It is in the person editor and in the New Person window.",
    "New: Scribe Data can ask whether a person is male or female. Turn the question off under Scribe Data Questions in Settings, or press Never Ask This.",
    "Improved: when Scribe Data links two people it now fills in gender-specific labels when it knows the gender. Brother of a woman becomes Sister, Father of a man becomes Son, Husband of a woman becomes Wife. Without a gender it uses Sibling, Child, Spouse and so on.",
    "Improved: gender counts toward Intel. Backups keep gender. Help updated."
  ]},
  {v:"0.16.0",d:"2026-10-08 05:35 PDT",items:[
    "Changed: addresses are now four boxes: street address, city, state and zip. Addresses you saved before move into the street box. Backups from older versions import the same way.",
    "Changed: Scribe Data asks relationship questions only for people who are not linked yet, in either direction. When you link two people it adds the link on both sides. Common labels fill in the other side for you (brother becomes sibling, boss becomes employee).",
    "New: Scribe Data also asks you to add a tag to tasks that have none.",
    "New: choose which question types Scribe Data asks in Settings, under Scribe Data Questions. A Never Ask This button in the Scribe Data window turns off the current type.",
    "New: the Intel box in Settings counts the details you have collected and shows a pixel brain that grows with your intel and the size of your save.",
    "Improved: Help updated."
  ]},
  {v:"0.15.0",d:"2026-10-08 05:05 PDT",items:[
    "New: repeating tasks. In the task window pick Repeat: every X days, every X weeks on the days you choose, every X months (same day of the month, same weekday like the 2nd Tuesday, or the last matching weekday) or every X years.",
    "New: when you complete a repeating task, from the Projects list or the Bridge, the next one is created automatically with the next due date. Unchecking a completed task removes the new copy if you have not completed it.",
    "New: repeating tasks show a cyan repeat chip. A repeating task with no due date starts today.",
    "Improved: if you finish a repeating task late, the next one lands on the next date from the old schedule that is today or later, so it does not start overdue. Backups keep repeat settings. Help updated."
  ]},
  {v:"0.14.0",d:"2026-10-08 04:40 PDT",items:[
    "New: Import on the Notes tab turns a .txt, .md, .docx or .pdf file into a plain text note tagged imported. Word files are read right in the app and work offline. PDF files need an internet connection the first time.",
    "New: the Read window has Copy (puts the note on your clipboard) and Export .txt (downloads the note as a text file).",
    "New: Export All on the Notes tab downloads every active note in one text file.",
    "Improved: notes over 20,000 characters are cut at that size on import, and you are told. Help updated."
  ]},
  {v:"0.13.0",d:"2026-10-08 04:15 PDT",items:[
    "Changed: Notes now has a big + button in the bottom right that opens a New Note window, like tasks, events and people. The side editor is gone.",
    "Changed: search is now a Search button that opens a search window. A chip next to the button shows the active search and clears it.",
    "New: every note has Read, Edit, Archive and Delete buttons. Read opens the full text in a window. Edit opens the edit box and saves only when you press Save Note. Tapping a note opens Read.",
    "New: Archive moves a note you no longer need out of the list and out of search. Settings has a new Archived Notes box where you can read archived notes and press Unarchive to bring them back.",
    "Improved: backups save archived notes. Help updated. Notes no longer autosave, so press Save Note to keep edits."
  ]},
  {v:"0.12.0",d:"2026-10-08 04:00 PDT",items:[
    "Changed: the To-Do tab is now Projects, with two sections at the top: Tasks and Projects. The Projects section has its own + button for a New Project window.",
    "New: tasks can be paused and resumed. A Pause or Resume button sits on every unfinished task. Paused tasks show a PAUSED label, sort below active tasks and are skipped by the Bridge. The Tasks filters are now All, Active, Paused and Done.",
    "New: the Bridge Next Tasks list has Pause and Complete buttons on every task. Press either one and the next task in line moves up. Click a task to open it in the Tasks list.",
    "New: tasks now have tags and tagged people, and can belong to a project. Edit now opens a window with all of these fields instead of editing in the list.",
    "New: projects have a name, a deadline, general notes and tagged people. Each project shows a percent complete bar from its finished tasks. View Tasks shows only that project's tasks, and Add Task starts a new task already in the project. Deleting a project keeps its tasks.",
    "New: Settings, Support now says IntelDeck was created by Ian McGonigal, above the Patreon link.",
    "Improved: backups and restore include projects and the new task fields. Old backups and old tasks still work. Deleting a person removes them from tasks and projects. Help updated."
  ]},
  {v:"0.11.1",d:"2026-10-07 23:25 PDT",items:[
    "Changed: the New Task, New Event and New Person windows and the Scribe Data window now open with no box selected, so the phone keyboard does not pop up until you tap a box.",
    "Improved: Help updated."
  ]},
  {v:"0.11.0",d:"2026-10-07 23:30 PDT",items:[
    "New: a big + button in the bottom right of the To-Do, Calendar and People tabs opens a New Task, New Event or New Person window. Press N to open the same window from the keyboard.",
    "Changed: the inline New Task form on To-Do and the New Event form on Calendar are gone. The New Event window starts on the day you have selected and lets you change the date.",
    "Changed: People no longer has a New Person button or a blank editor. The editor appears when you pick a person. The New Person window also takes tags, typed with commas.",
    "New: when you have fewer upcoming events than the Bridge shows, the empty spots fill with upcoming birthdays. This follows the Birthdays button on the Calendar.",
    "Improved: Help updated."
  ]},
  {v:"0.10.0",d:"2026-10-07 22:55 PDT",items:[
    "Renamed: the app is now IntelDeck. The title screen no longer shows the version, the top bar no longer shows the version and the bottom status bar is gone. The version and build time are in Settings. Your saved data and old backups still work.",
    "Changed: the Bridge now shows your next tasks and your next calendar events. Click one to open it. The Welcome, Today Briefing and Now Playing boxes are removed.",
    "Changed: the Bored? button is now Scribe Data and stays on the Bridge. It shows how many details are missing.",
    "New: Settings has a Display section. Choose how many next tasks and next events the Bridge shows (default 3 each) and how many Games, Books and Video slots Entertainment shows (default 3 each, up to 9). Extra slots are named Game 4, Book 4 and so on, and a slot that holds an item always stays visible.",
    "New: Settings has a Support section with a link to the Patreon page.",
    "Improved: backups save the new Display settings. Help updated."
  ]},
  {v:"0.9.0",d:"2026-10-07 21:04 PDT",items:[
    "New: People now have Occupation, Address, Tags and Relationships. Tags are for skills, interests and games they play. Relationships link a person to another person with a label such as brother or boss. The other person's card shows it as Listed by.",
    "New: tag autofill. Every tag you use is remembered and offered as a suggestion when you add a tag, in People and in Bored.",
    "New: the Bridge has a Bored? button. It asks about one missing detail of a random person, one question at a time: name parts, relationship, birthday, phone, email, occupation, address, a tag, or a relationship to another person. Notes are never asked. Skip passes on a question for this session.",
    "Improved: People search also looks in occupation, address, tags and relationships. Tags show on the list. Deleting a person removes links to them. Backups carry the new fields."
  ]},
  {v:"0.8.1",d:"2026-10-07 20:55 PDT",items:[
    "Removed: the status badge, the progress bar and slider, and the +10% button from items in Playing, Shelved and Completed. Items now show type, title, detail and notes.",
    "Removed: the Status and Progress fields from the Playing editor and the Progress field from Add to Shelved.",
    "Changed: the Bridge Now Playing panel lists every filled slot by title."
  ]},
  {v:"0.8.0",d:"2026-10-07 20:52 PDT",items:[
    "Changed: Playing, Shelved and Completed are now one Entertainment tab (key 6) with three sections. Buttons at the top switch sections and show item counts. Settings is now key 7.",
    "New: add items directly to Shelved and Completed with the new Add to Shelved and Add to Completed forms (type, title, detail, notes). Completed has a Completed on date so you can log things you finished earlier.",

    "Improved: backups save the new setting. The N key jumps to the add form in Shelved and Completed.",
    "Improved: Help rewritten for the Entertainment tab. The Bridge Now Playing panel is unchanged."
  ]},
  {v:"0.7.1",d:"2026-10-07 20:45 PDT",items:[
    "Removed: the Module Status and System boxes on the Bridge. Version, build time, storage status and last backup are still in Settings."

  {v:"0.7.0",d:"2026-10-07 20:43 PDT",items:[
    "Changed: the Data tab is now Settings (key 9). The sound button and volume slider, the Updates button and the Help button moved there from the top bar. The H, U and M keys still work from any tab.",
    "New: Test Sound and a volume percentage readout in Settings.",
    "Improved: scrollbars and sliders now match the blue and cyan theme. The tab bar scrolls sideways with a themed bar when the window is narrow, and the active tab scrolls into view.",
    "New: People now have separate First name, Middle name and Last name boxes. Existing people are split automatically, using the last word as the last name and anything in between as the middle name. Open a person to adjust it.",

  {v:"0.6.0",d:"2026-10-07 20:37 PDT",items:[
    "New: Shelve button on every Playing slot. Shelved items move to the new Shelved tab and free the slot.",

    "New: Completed tab (Completed Media) with Wallpaper made and Card made checkboxes, totals, search, and filters for Games, Books, Video, No wallpaper and No card. Play Again starts an item over at 0%.",
    "Changed: Playing status is now Playing, Reading or Watching, or Paused. The old Finish button became Complete, and the old Dropped status became Shelve. Existing finished and dropped items are moved to Completed and Shelved automatically.",
    "Changed: +10% no longer finishes an item at 100%. Press Complete when you are done.",

  {v:"0.5.0",d:"2026-10-07 20:26 PDT",items:[
    "Fixed: tasks and other items could silently fail to save when the browser blocked storage, for example inside a preview window or a private window. A red warning bar now appears at the top whenever saving is blocked, with a button to the Data tab.",
    "New: Data tab. Export File downloads a full backup, Copy Backup copies the same text if downloads are blocked.",
    "New: Restore from a backup file or pasted text. A summary is shown first and replacing your data needs a confirmation click. Invalid items are skipped safely.",
    "New: Erase All Data, protected by typing ERASE. Test Sound button and storage details.",
    "New: Bridge shows when you last made a backup.",
    "New: keyboard shortcuts N (new item on the current tab), / (search Notes or People) and 7 (Data tab).",
    "Improved: the error sound for a failed save now plays once instead of on every save.",

    "Improved: Help rewritten with backup and troubleshooting information."

  {v:"0.4.0",d:"2026-10-07 20:41 PDT",items:[
    "New: Playing module with nine slots. Games: console, computer and handheld. Books: fiction, non-fiction and comics or manga. Video: movie, TV show and cartoon or anime.",
    "New: each slot keeps a title, detail, status (active, paused, finished or dropped), progress percent and notes.",

    "New: Bridge Now Playing panel lists everything you are currently playing, reading or watching, with progress.",
    "Improved: all six modules are now online. Help updated for Playing."

  {v:"0.3.0",d:"2026-10-07 20:31 PDT",items:[
    "New: Notes module. Write notes with a title, tags and body, search across everything, filter by tag, and delete with a confirmation click.",
    "New: Notes save automatically when you switch notes or tabs. Press Save Note or Ctrl+Enter to save right away.",
    "New: People database with name, relationship, phone, email, birthday and notes. Search, sort by name, relationship or next birthday, and quick Call and Email links.",
    "New: birthdays appear on the Calendar as green markers, in the day panel with the age, and in the Upcoming list. A Birthdays toggle on the Calendar turns them on or off.",
    "New: Bridge Today Briefing shows the next birthday, and the Bridge counts your notes and people.",
    "Improved: Help now covers Notes, People and Calendar birthdays."

  {v:"0.2.0",d:"2026-10-07 20:12 PDT",items:[
    "New: To-Do module. Add tasks with priority and due date, check them off, edit, delete, filter by All, Active or Done, and clear finished tasks.",
    "New: Calendar module. Month view, previous and next month, jump to Today, click a day to see and add events with optional time and notes, edit and delete events.",
    "New: Calendar shows tasks due on each day with a separate marker.",
    "New: Upcoming list shows events in the next 30 days. Click one to jump to its day.",
    "New: Bridge Today Briefing with open tasks, overdue, due today, events today and next event.",
    "New: sound effects for completing a task and removing an item.",
    "New: two-click delete confirmation so items are not removed by accident.",
    "Improved: Help rewritten for To-Do and Calendar.",
    "Improved: tabs refresh when opened so dates and counts stay current."
  ]},
  {v:"0.1.0",d:"2026-10-07 19:58 PDT",items:[
    "New: sci-fi command deck interface with parallax scrolling starfield.",
    "New: title screen showing version and build date and time.",
    "New: tab navigation for Bridge, To-Do, Calendar, Notes, People and Playing.",
    "New: synthesized sound effects with mute and volume control.",
    "New: automatic local save layer used by every module.",

const HELP=[
  {h:"What this is",html:"<p>IntelDeck is a personal command deck for tracking the information you need. It runs entirely in this single file and stores everything in your browser.</p>"},
  {h:"Navigation",html:"<ul><li><b>Layout:</b> boxes are packed tightly in columns with small even gaps, so pages have little empty space. The number of columns follows the width of your window. A list of cards (tasks, people, notes, news, assets and so on) fills each row evenly. In a column layout such as the Bridge, boxes run down the first column, then the next, so their order reads top to bottom, then left to right.</li><li>Click a tab to switch modules (the tabs are not numbered, but the number keys still work), or press <kbd>1</kbd> to <kbd>9</kbd>, or <kbd>0</kbd> for Settings.</li><li><b>Bridge</b> is the overview. It shows your next tasks (with Pause and Complete buttons), your next calendar events and the Scribe Data button. If you have fewer upcoming events than the Bridge shows, the empty spots show upcoming birthdays while the Calendar Birthdays button is on.</li><li>After Initialize you see the login screen. See Account and login for details.</li><li>Boxes are sized to their text instead of stretching across the whole page, so more fits on screen. This applies to the Bridge boxes, the Settings boxes and the cards on every tab.</li><li>All modules are online: Bridge, Projects, Calendar, Notes, People, Entertainment, Assets, Accounting, News and Settings.</li></ul>"},
  {h:"Account and login",html:"<ul><li>After you press Initialize, the login screen opens. <b>Log In</b> with your email and password. <b>Create Account</b> asks for your email and a password twice (at least 6 characters). You may get a confirmation email; open its link, then log in.</li><li><b>Forgot Password</b>: type your email first, then press it. A reset email arrives; its link opens IntelDeck with a Set a New Password box. The link only works if the deck is opened from the web address set in your Supabase project.</li><li><b>Use Local Profile</b> skips accounts and uses the data on this device, as before.</li><li><b>Remember me on this device</b> keeps your email and password filled in on the login screen next time. It never signs you in by itself; you still press Log In. The password is stored on this device in a scrambled form that is not real encryption, so only tick it on a device you trust. Untick it and log in to clear the saved login.</li><li>Settings, Account shows who is signed in and has Log Out, Log In or Create Account, and Forget Saved Login (clears the saved email and password).</li><li><b>Saving to your account:</b> while signed in, every change is copied to your account about 3 seconds later. When you open the deck, come back to it, or press Sync Now in Settings, Account, it checks for a newer copy saved from another device and loads it. If both changed, the most recent save wins. A copy stays on this device so the deck works offline; changes wait and upload when you are back online.</li><li><b>Data already on a device:</b> the first time you sign in on a device that has its own data, a window shows how many items are on the device and in your account. <b>Delete Local Data, Keep Account</b> replaces the device data with your account copy. <b>Replace Account With This Device</b> uploads the device data over your account (press twice to confirm). Either way the device ends up holding only your account copy. Leave the backup tick on to download the device data as a file first. If you close the window, Settings, Account has Choose What To Keep.</li><li><b>Log Out</b> uploads waiting changes, then removes your account data from this device. If the upload fails you are warned first.</li><li>While signed in, Erase All Data and Restore change your account copy too. UI size, text size and opacity stay per device.</li><li><b>One-time setup for the owner:</b> the account data needs a table called deck_data in Supabase with row level security, so each person can only read and write their own row. If Settings, Account says the table is missing, run the setup SQL from the IntelDeck design notes in the Supabase SQL editor.</li></ul>"},
  {h:"New version notice",html:"<ul><li>When IntelDeck is opened from a web address, it checks that address for a newer version about 4 seconds after opening, every 10 minutes, and whenever you come back to the tab. If one is found, a box appears at the top: <b>Refresh Now</b> reloads the page to load it, <b>Later</b> hides the box for 30 minutes.</li><li>Refresh Now first saves a person you are editing on the People tab and uploads waiting account changes. Anything typed into other open windows and not saved is lost, so save first if you are in the middle of something.</li><li>Updates, <b>Check For New Version</b> checks right away and tells you the result.</li><li>A copy opened as a file from your computer cannot check, because it has no web address to look at. The notice does nothing there.</li></ul>"},
  {h:"Bridge",html:"<ul><li><b>Weekly Report:</b> press Open Report in the Weekly Report box. It lists the next 7 days of events, tasks due, birthdays and holidays, overdue tasks and the 9 default Now Playing slots (3 games, 3 books, 3 video). Press Print / Save as PDF and pick Save as PDF as the destination to make a file; it is sized for one US Letter page. Extra Now Playing slots are not included.</li><li><b>Market Ticker</b> scrolls across the top with the price of each stock, crypto, precious metal, collectible and other priced item you own in Assets. Prices come from Assets. A price you typed yourself and have not looked up shows a small TYPED mark. After a lookup finds a different price, a green up arrow or red down arrow shows the percent change from the price before that lookup. It stays until the next lookup finds another change. Editing an item clears its change. The box is hidden when you own nothing with a price. Hover or touch it to pause.</li><li><b>Net Worth</b> adds up everything in Assets (vehicles, homes, investments and accounts), subtracts your loans and debts, and shows all three numbers. It is hidden until you add assets or loans.</li><li><b>Now Playing</b> lists every game, book and show in your Playing slots with its percent, and scrolls by itself when there are more than three. It is hidden when no slot is filled.</li><li><b>Breaking News</b> shows the top three headlines for the country chosen in the News tab. Press a headline to read it in a new tab. Headlines refresh when you open the Bridge if the saved ones are over 30 minutes old. If you are offline it shows the last saved ones, or asks you to open the News tab.</li><li>If your device is set to reduce motion, the ticker and list do not scroll, you swipe them instead.</li></ul>"},
  {h:"Projects: Tasks",html:"<ul><li>The Projects tab (key <kbd>2</kbd>) has two sections at the top: Tasks and Projects. Tasks is the old To-Do list.</li><li>Press the + button in the bottom right, or <kbd>N</kbd>, to open the New Task window. Type a task, choose a priority and an optional due date, then press Add Task or Enter.</li><li>A task can also have a project, tags (separated by commas, with suggestions from tags that a person or task currently has) and tagged people. Pick a person and press Add Person. Click the x on a person to remove them.</li><li>Each task is a small card, and the cards sit side by side across the page, so you see more tasks at once. Each card is only as wide as its text needs. Tick the box on a card to complete the task. Tick it again to reopen it.</li><li><b>Type</b> in the task window marks a task as Work (briefcase icon) or Personal (house icon). It is optional.</li><li><b>Repeat</b> in the task window makes a task come back. Choose Days, Weeks, Months or Years and a number. Weeks lets you tick the days of the week (every 2 weeks on Mon and Thu, for example). Months can repeat on the same day of the month, on the same weekday (the 2nd Tuesday) or on the last matching weekday. When you complete the task, from the list or the Bridge, the next one appears with the next due date. A task that repeats with no due date starts today. If you finish late, the next date skips ahead to today or later so it is not already overdue. Unchecking a finished task removes its unfinished copy. To stop a repeat, edit the task and set Repeat to Does not repeat.</li><li><b>Pause</b> sets a task aside without finishing it. Paused tasks show PAUSED, sort below active tasks and do not appear on the Bridge. Press <b>Resume</b> to put it back in line.</li><li>Edit opens a window with every field. Delete asks for a second click within 3 seconds to confirm.</li><li>Filters: All, Active, Paused or Done, plus Work and Personal (the Type you set on a task). Work and Personal combine with the status filter, so Active plus Work shows only active work tasks. Press the highlighted Work or Personal chip again to clear it. Your choice is remembered on this device. When you pick View Tasks on a project, a Project chip appears. Press it to show every task again. Clear Done removes every finished task after a second click.</li><li>Tasks sort by status (active, paused, done), then priority (high first), then due date. Overdue tasks show in red and tasks due today in amber.</li><li>On the Bridge, press Pause or Complete on a task and the next active task moves up.</li><li>A File taxes task (due April 15, repeats yearly) is added for you automatically once. See Settings, Automatic Tasks.</li></ul>"},
  {h:"Projects: Projects",html:"<ul><li>A project groups tasks toward one goal. Switch to the Projects section, then press the + button to open the New Project window.</li><li>A project has a name, an optional deadline, general notes and tagged people.</li><li>The percent complete bar is finished tasks divided by all tasks in the project. Paused tasks count as not finished. A project with no tasks shows 0%.</li><li><b>Add Task</b> opens a new task already in that project. <b>View Tasks</b> shows only that project's tasks. To move an existing task into a project, edit the task and choose the project.</li><li>Projects sort by deadline, with no deadline last. Overdue projects show in red and completed projects in cyan.</li><li>Deleting a project asks for a second click and keeps its tasks, which become project-free.</li></ul>"},
  {h:"Calendar",html:"<ul><li>Check boxes, number boxes, drop-down lists and the date picker all use the app's dark colors. The date and time pickers are drawn by your browser, so their exact look can vary slightly.</li><li><b>Location:</b> an event can have a place (optional). It appears under the title in the day list, Upcoming and the Bridge. In the day list, Map opens the place in Google Maps in a new tab.</li><li><b>Work and Personal events:</b> add or edit an event and pick a Type. A tagged event shows a briefcase (Work) or house (Personal) icon in the day list, Upcoming and Bridge, and its dot on the month grid is pink for Personal (Work and untagged events keep the usual cyan dot). Below the month grid, All, Work and Personal buttons filter the grid, day list and Upcoming; untagged events only show under All. Birthdays, holidays and tasks due are not filtered. The Bridge Next Events box is not filtered either.</li><li>Use the arrow buttons to change month and Today to jump back to the current day.</li><li>Click any day to select it. The side panel shows that day's events and tasks due.</li><li>To add an event, press the + button or <kbd>N</kbd>. The window starts on the selected day. Change the date if you like, add an optional time and notes, then press Add Event.</li><li>Cyan dots mark events. An amber square marks tasks due that day.</li><li>Edit opens the event window with every field. Delete needs a second click to confirm.</li><li><b>Repeat</b> in the event window makes an event come back: every X days, every X weeks on the days you tick, every X months (same day of the month, same weekday like the 2nd Tuesday, or the last matching weekday) or every X years. A repeating event shows on every matching day, in Upcoming and on the Bridge, and the day list notes how it repeats. Editing or deleting a repeating event changes the whole series. To stop a repeat, edit the event and set Repeat to Does not repeat.</li><li>Upcoming lists events, birthdays and holidays in the next 30 days. Click one to jump to it.</li><li><b>Holidays</b> show as violet markers and in the day list. The Holidays button under the calendar turns them all on or off. Press <b>Hide</b> on a holiday in the day list to stop showing that one. In Settings, Holidays lets you turn off whole groups (US federal, other well-known days, Christian, Jewish, Islamic, Hindu and Sikh, Lunar New Year) or pick individual holidays. Show Every Holiday Again resets your choices. Jewish holidays are shown on the first full day (they begin at sundown the evening before). Islamic, Hindu and Lunar New Year dates come from moon calculations and can differ by a day where you live. On the Bridge, holidays fill empty spots in Next Events after birthdays.</li><li>Tasks due are shown on the calendar, but you complete them in the Projects tab.</li><li>Holidays have icons: a flag for US federal days, special ones for days like Christmas, Halloween, Easter and Diwali, and a symbol for each religious group.</li><li>People birthdays show as green markers and in the day panel with the age. Use the Birthdays button under the calendar to show or hide them.</li></ul>"},
  {h:"Notes",html:"<ul><li>Press the + button in the bottom right of the Notes tab, or <kbd>N</kbd>, to open the New Note window. Fill in a title, optional tags separated by commas, and the note text, then press Add Note. <kbd>Ctrl</kbd>+<kbd>Enter</kbd> saves from inside the text box.</li><li>Each note in the list has four buttons. <b>Read</b> opens the full text. <b>Edit</b> opens the edit window. <b>Archive</b> moves the note out of the list. <b>Delete</b> asks for a second click within 3 seconds to confirm. Tapping the note itself also opens Read.</li><li>Edit changes are saved only when you press Save Note. Closing the window discards them.</li><li><b>Import</b> reads a .txt, .md, .docx or .pdf file and saves its text as a new plain text note tagged <i>imported</i>. Word files work offline. PDF files load a reader from the internet the first time, so they need a connection. Scanned PDFs that are only pictures have no text to read. Notes are limited to 20,000 characters.</li><li>In the Read window, <b>Copy</b> puts the note (title, tags and text) on your clipboard and <b>Export .txt</b> downloads it as a text file. <b>Export All</b> on the Notes tab downloads every active note in one file.</li><li><b>Search</b> opens a search window. It looks through titles, text and tags. The search shows as a chip next to the button. Press the chip to clear it. <kbd>/</kbd> opens the same window.</li><li>Notes are cards side by side, each only as wide as its text needs.</li><li>Click a tag chip to show only notes with that tag. The newest edited note appears first.</li><li><b>Archive</b> is for notes that are no longer relevant. Archived notes disappear from the list and from search. Open Settings, then Archived Notes, to read them or press Unarchive to bring one back. Backups include archived notes.</li></ul>"},
  {h:"Scribe Data",html:"<ul><li>Press <b>Scribe Data</b> on the Bridge to fill in gaps. The Bridge shows how many details are missing across people and tasks.</li><li>It picks a random person or task and asks about one missing detail: a name part, gender, birthday, phone, email, occupation, religion, street address, city, state, zip, a tag, or a relationship to another person. Tasks without a tag are asked for a tag. Notes are never asked. The gender question has two buttons, Male and Female, and one tap saves it.</li><li>Relationship questions only come up for people who are not linked yet. The question reads 'How is (person) related to (person B)?' where person B is the first person who is not linked yet, chosen for you with no list to change it. Type what person B is to the first person (for example brother or boss). Typing Unknown or Co-worker fills in the same label for the other person. The other side fills in for common labels and you can change it. When the person's gender is set it uses it (a brother of a woman becomes sister, a father of a man becomes son). Otherwise it uses Sibling, Child, Spouse and similar. Both people are updated.</li><li>Tap the answer box to type it, then press Save or Enter. Tag answers autofill from tags that a person or task currently has, so old tags and misspellings nothing uses any more are not offered. A person tag question has Interest, Game and Skill buttons: tap one to save the tag with that type, or press Save to save it with no type.</li><li><b>Skip</b> passes on a question for now. Skipped questions return after you reopen the page or press Ask Skipped Again. <b>Never Ask This</b> turns off that whole question type. Turn types back on in Settings under Scribe Data Questions. <b>Done</b> closes the window.</li></ul>"},
  {h:"People",html:"<ul><li><b>No address prompts:</b> text boxes tell Brave and Chrome not to autofill or offer to save addresses. If your browser still shows a prompt, choose Never or turn off Save and fill addresses in its settings.</li><li><b>Birthdays:</b> pick a month and a day, and type the year only if you know it. With a year, the person list shows their age and the Calendar and Bridge say \"turns N\". Without a year, only the name shows. If the day is not valid for the month (such as Feb 30), it is set to the last day of that month; if you choose only a month or only a day, the birthday is left empty.</li><li>Press the + button in the bottom right, or <kbd>N</kbd>, to add a person. Enter a first name, and optionally a middle name, last name, gender (male or female), birthday (month and day, with the year only if you know it), phone, email, occupation, religion, street address, city, state, zip, tags (separated by commas) and notes. A first or last name is required.</li><li>People are shown as cards side by side, each as wide as its text needs. Every person card has an <b>Edit</b> button. It opens the editor in a window with all of that person's details, tags and relationships. Birthday, gender and the Is this you? choice share one row, and short boxes such as state and zip sit beside the city instead of taking a whole row.</li><li>Tags describe skills, interests or games the person plays. Type a tag and press Enter or Add Tag. Choose Interest (star), Game (controller) or Skill (tools) in the list beside the box to give the tag a type and an icon; leave it on No type for a plain tag. Add an existing tag again with a type to change its type. Tags that a person or task currently has are suggested as you type. Click the x on a tag to remove it.</li><li>Relationships link the person to someone else in your list: choose the person, type how they are related (for example brother or boss) and press Add Link. The other person's card shows it as Listed by, so you only enter a link once. Links are the only way to record how people are related; there is no separate Relationship box. Delete a link with its x.</li><li>In the editor window, press Save Person to save and close it. Closing the window another way (Close, Esc or tapping outside) also saves your changes, as long as a first or last name is filled in. Delete in the editor asks for a second click.</li><li>Search looks through names, occupation, address, tags, links and notes. Sort by name (last name, then first) or next birthday.</li><li>Birthday shows how many days remain. People with a birthday also appear on the Calendar.</li><li>Call and Email links appear when a person has a phone or email saved.</li><li><b>Your entry:</b> the first time you open People, and whenever no entry is marked as you, a window asks you to fill one in. Fill In Now opens the form, That Is Me marks someone already in your list, and Not Now asks again next time. Your entry shows a Me tag and sorts like everyone else. To change which entry is you, open your own entry, set Is this you? to No, then mark the other person. The box is hidden on other people while your entry exists. Only one entry can be you.</li><li>Phone numbers add dashes as you type (555-123-4567). A number with letters or a plus sign is kept exactly as typed.</li><li>Religion is free text. Religions you already entered are suggested as you type.</li><li>Delete asks for a second click to confirm.</li></ul>"},
  {h:"News",html:"<ul><li>The News tab opens on Breaking News each time you open it. Choose another topic or search after it opens. It asks for up to 10 headlines, drops those tagged sports, health, environment or entertainment, and asks for one more page if fewer than 5 are left. If you still see fewer than 5, the source did not send more, or the request failed (the reason shows above the list).</li><li>Each headline shows a picture preview when the news source has one. If the picture is missing or fails to load, a topic picture is shown instead. The page shows 5 headlines at most. Sports, health, environment and entertainment news are left out everywhere in IntelDeck; a headline tagged with one of those topics is hidden, but a story that is not tagged can still slip through.</li><li>The News tab (key <kbd>9</kbd>) shows headlines from NewsData.io. The tab opens on Breaking News. Pick a country and a topic (Breaking News, All topics or a single topic), or type words to search for and press Enter, then press Refresh to load now.</li><li>Each topic has an icon, such as a siren for Breaking News.</li><li>Each headline opens the full story in a new tab. Under it you see the source, how long ago it was published and a short summary.</li><li>The last articles for each search are saved on this device. If you are offline, or the free daily limit is used up, you see the saved copy and a note saying why.</li><li>Opening the tab reloads headlines only when the saved ones are over 30 minutes old, to save your free allowance. Refresh always loads new ones.</li><li>The NewsData key is in Settings under Live Prices. It is already filled in; replace it if you get a key of your own.</li></ul>"},
  {h:"Accounting",html:"<ul><li>The boxes on this tab are packed edge to edge in columns with small even gaps, and stack on a narrow screen.</li><li>The Accounting tab (key <kbd>8</kbd>) shows your estimated monthly bills and what you owe. Press the + button in the bottom right and choose Rent, Subscription, Utilities, Food, Gas, Entertainment budget, Credit card, Loan, Other (for any bill not listed) or Other debt (money you owe that is not a card or loan).</li><li>A bill is an amount per month, per year or per week. Yearly and weekly amounts are converted to a monthly estimate (weekly is amount times 52 divided by 12). For food and gas, enter your average.</li><li>A credit card or loan takes a balance, the interest rate (APR) and optionally your monthly payment. The interest shown is balance times rate divided by 12, a rough estimate that ignores how the payment changes the balance during the month. Mortgage interest is not counted in Estimated interest per month. It has its own line, Mortgage interest (tax write-off), per month and per year, for homes with a mortgage and an interest rate.</li><li>Mortgages and vehicle loans from the Assets tab appear here automatically, are counted in the totals, and are edited in Assets.</li><li>The totals at the top: estimated per month (bills plus loan and card payments), per year, total owed and estimated interest per month.</li><li>Edit changes an item. Delete asks for a second click.</li></ul>"},
  {h:"Assets",html:"<ul><li><b>Assets to Buy</b>: press the + button on the Assets tab, choose <b>To Buy</b>, and type what you want, an estimated price, notes and a link. The Assets to Buy box lists each item and the estimated total. <b>Bought</b> takes the item off the list and opens Add an Asset so you can enter it as a vehicle, home or investment (the name is not filled in for you). Items on this list are not counted in Net Worth, the pie or the Market Ticker.</li><li>The boxes on this tab are packed edge to edge in columns with small even gaps, and stack on a narrow screen.</li><li>The Assets tab (key <kbd>7</kbd>) keeps things you own. Each kind has an icon (car, house, stock chart, gold, vase, coin, bank, palm tree, box). Press the + button in the bottom right and choose Vehicle, Home, an investment type, or Other for anything else you own (type its value yourself; it shows as Other in the pie chart).</li><li>Fill in what you know: name, year, bought date and price, odometer, last oil change, wipers, air filter, tires, brake fluid check, antifreeze check, registration, and loan balance, monthly payment, due day and optional interest rate.</li><li>Each date creates a repeating task in Projects (tagged vehicle), due after a typical gap: oil 6 months, wipers and air filter 12, tires 5 years, brake fluid and antifreeze 2 years, registration 12 months. The gaps are general guesses, not a manufacturer schedule, and ignore mileage.</li><li>A loan creates a Pay loan task on its due day each month. Finishing it lowers the balance by the payment (less interest if you gave a rate). At zero the payments stop.</li><li>When you finish a maintenance task, today becomes the last-done date and a window lets you change the date and add the odometer. The next task is scheduled from that date.</li><li>Edit a vehicle to change anything; its open tasks update to match (a due date you changed by hand is replaced). Delete removes the vehicle and its open tasks.</li><li>Homes: choose Home in the + menu. Enter name, address, bought date and price, current value, last property tax and insurance dates (each creates a yearly task, tagged home) and mortgage balance, payment, due day and optional rate (a monthly Pay mortgage task). Property tax and insurance dates are only a year after the last one you entered; they do not know your real bill dates, so edit the due date if needed.</li><li><b>Investments and accounts:</b> choose Stock, Precious metal, Collectible, Crypto, Bank account or Retirement account in the + menu. Stocks, retirement and crypto take a quantity, the price you paid per unit and a current price you type in (value is quantity times current price). A stock or retirement account can use a plain balance instead. Metals use ounces. Collectibles use what you paid and the current value. Bank accounts take a balance and interest rate. Gain or loss shows when you gave a price paid.</li><li><b>Totals and pie chart:</b> the top of the Assets tab adds up vehicles, homes and every investment (a vehicle or home counts its Current value), subtracts what you owe from loans and cards in Accounting for the net worth line, and draws a pie of each kind's share. The list beside the pie gives the amounts and percentages. Prices are not looked up online yet.</li><li><b>Live prices:</b> press Refresh Prices on the Assets tab. Crypto uses CoinGecko (no key; put the coin name or symbol such as BTC). A stock or retirement account needs a ticker symbol and a number of shares, plus a free Finnhub key from finnhub.io entered in Settings. Metals need a MetalCharts key and an amount in ounces. Prices are in US dollars. Only items with an amount are looked up. If a lookup fails you will see why and your last price is kept. Some sites may not allow lookups from a saved page; if so, type the price yourself.</li><li><b>Look up links:</b> PriceCharting (collectibles), Kelley Blue Book (vehicles) and Check rate (bank accounts) open the website in a new tab. They are not read automatically, so type the value into the item.</li></ul>"},
  {h:"Entertainment",html:"<ul><li>The Entertainment tab (key <kbd>6</kbd>) keeps everything you play, read and watch in three sections: Playing, Shelved and Completed.</li><li>Playing slots, Shelved items and Completed items are all cards side by side, each only as wide as its text needs. A slot being edited widens to fit its boxes.</li><li>Switch sections with the buttons at the top. Each shows how many items it holds.</li><li>Items move between sections: from Playing to Shelved or Completed, and back to Playing again.</li></ul>"},
  {h:"Entertainment: Playing",html:"<ul><li>Games show a system icon beside the Detail (for example a P for PlayStation, an X for Xbox, a mushroom for Nintendo, a computer for Steam or PC, a handheld for Steam Deck). It is picked from the words you type in Detail, so type the system there. If it is not recognized you get a controller, computer or handheld icon for that slot.</li><li>The Bridge Now Playing box scrolls by itself when two or more items are playing. Each row has an icon for games, books or video, and games also show their system. Hover over the box to pause it.</li><li>Each item has a small picture beside its title, here and in Shelved and Completed. By default it is a pixel icon drawn from the title. In Settings, Entertainment Pictures lets you turn pictures off or use Wikipedia thumbnails instead (see Settings).</li><li>Slots track what you are into right now. There are three per group by default. Games: console, computer, handheld. Books: fiction, non-fiction, comics or manga. Video: movie, TV show, cartoon or anime. Settings, under Display, lets you show up to nine per group. Extra slots are named Game 4, Book 4 and so on. A slot that holds an item always stays visible.</li><li>Press Set on an empty slot, or Update on a filled one. Fill in the title and, optionally, a detail such as the platform, author or episode.</li><li><b>Complete</b> moves the item to Completed. <b>Shelve</b> moves it to Shelved to try again later. Both free the slot. <b>Clear</b> deletes the item permanently after a second click.</li><li>Press Enter to save while editing or Esc to cancel. Leaving the tab while editing discards unsaved changes.</li></ul>"},
  {h:"Entertainment: Shelved",html:"<ul><li>Shelved keeps things you set aside so you can try them again.</li><li>Shelve an item from Playing, or add one directly with the + button in the bottom right (or <kbd>N</kbd>) while you are on Shelved: choose a type, enter a title, and optionally a detail and a note, then press Add to Shelved.</li><li><b>Try Again</b> moves the item back into its Playing slot. The slot must be empty. If it is in use, shelve or complete the current item first.</li><li>Search the list, or filter by Games, Books or Video. Delete removes an item permanently after a second click.</li></ul>"},
  {h:"Entertainment: Completed",html:"<ul><li>Completed is your record of finished games, books and shows.</li><li>Complete an item from Playing, or add one directly with the + button in the bottom right (or <kbd>N</kbd>) while you are on Completed. Set the Completed on date to log something you finished earlier. It defaults to today.</li><li>Optional: turn on Track Wallpaper made and Card made in Settings under Completed Media. It starts off. When on, each item gets two checkboxes, the top shows totals, and extra filters appear for No wallpaper and No card.</li><li>Filters: All, Games, Books and Video. Search looks through title, detail and notes.</li><li><b>Play Again</b> moves an item back into its Playing slot at 0%. The slot must be empty. Delete removes an item permanently after a second click.</li></ul>"},
  {h:"Sound",html:"<ul><li>Open the Settings tab to mute or unmute, set the volume and test the sound. Press <kbd>M</kbd> to mute or unmute from any tab.</li><li>Sounds are generated live by your browser. No audio files are loaded.</li><li>Browsers only allow audio after you interact with the page, so sound begins when you press Initialize Systems.</li><li>Your sound settings are remembered.</li></ul>"},
  {h:"Settings",html:"<ul><li>Each box in Settings is a button. Press a button to open that box in a window; press Close, Escape or tap outside to come back. Changes you make there save as before. Opening Help, Updates or Choose What To Keep from inside a box replaces that window. The Account, Sound and Help and Updates buttons show a short status line.</li><li>The Settings tab (key <kbd>0</kbd>) holds Account, Intel, Scribe Data Questions, Holidays, Color Theme, Sound, Help and Updates, Entertainment Pictures, Automatic Tasks, Completed Media, Archived Notes, Display, Support, Backup, Restore, Storage and Erase All Data.</li><li>Entertainment Pictures: None, Pixel icons, or Wikipedia thumbnails. Thumbnails need an internet connection, send only the title (plus a word like book or video game) to Wikipedia, are saved on your device, and may pick the wrong page for vague titles. Clear Saved Thumbnails throws the saved ones away so they are looked up again.</li><li>Automatic Tasks: the deck adds a File taxes task once, due April 15, repeating every year. Delete or edit it like any task. The checkbox only controls whether it is added in future.</li><li>Drop-down choices open as an in-app list in the deck's style. Typing suggestions (tags, religion) also show in-app. Date, time and color choosers are the browser's own.</li><li>The Help and Updates buttons are here. You can also press <kbd>H</kbd> for Help and <kbd>U</kbd> for Updates from any tab.</li><li>Sound has an on and off button, a Test Sound button and a volume slider. Your choices are remembered.</li><li><b>Completed Media</b> has one switch, Track Wallpaper made and Card made. It starts off. When on, Completed items show two checkboxes plus totals and No wallpaper and No card filters.</li><li><b>Archived Notes</b> lists notes you archived. Press Read to view one or Unarchive to move it back to the Notes tab.</li><li><b>Color Theme</b> sets the accent color. Tap a preset or choose a custom color. It is remembered and saved in backups. Back to Cyan restores the original.</li><li><b>Holidays</b> has a switch for showing holidays, a tick box for each group and a list of every holiday to switch off individually.</li><li><b>Intel</b> shows how many details you have collected and a pixel brain. It lights up more as your intel and your save size grow.</li><li><b>Scribe Data Questions</b> has a tick box for each question type. Untick one to stop Scribe Data asking it.</li><li><b>Display</b> has three look controls. UI size (70% to 150%) scales the whole deck, so a larger number makes everything bigger and fewer things fit on screen. Text size (70% to 160%) changes the lettering only. UI opacity (30% to 100%) makes panels, tabs and windows more see-through. Windows stay at least half solid so they are readable. Use the - and + buttons to change size in steps of 10, and Reset Look to go back to 100%. These are remembered on this device and saved in backups. Display also sets how many next tasks and next events the Bridge shows (1 to 10, default 3) and how many Games, Books and Video slots Entertainment shows (1 to 9, default 3).</li><li><b>Support</b> says who made IntelDeck and has a link to the Patreon page.</li><li>Speed: the moving star background pauses while you scroll or type and while a window is open, so lists stay smooth. If the deck still feels slow on an old device, turn on reduced motion in your device settings to slow the stars further.</li></ul>"},
  {h:"Data and backups",html:"<ul><li>The Settings tab protects your information. Everything lives in this browser only, so make a backup now and then.</li><li><b>Export File</b> downloads everything as a .json backup. <b>Copy Backup</b> copies the same text if downloads are blocked.</li><li><b>Restore</b>: choose a backup file or paste backup text, press Check Backup to see a summary, then press Replace My Data and confirm with a second click. This replaces everything currently saved.</li><li><b>Erase All Data</b> deletes everything. Type ERASE to enable the button.</li><li>The Settings tab shows when you last made a backup.</li><li>Export before clearing browser data, moving the file or switching browsers.</li></ul>"},
  {h:"Saving your data",html:"<ul><li>Changes save automatically in this browser as soon as you make them.</li><li>A different browser or device starts empty until you restore a backup there.</li><li>Clearing browser data or using a private window can erase your data.</li><li>The opening screen is for show: its Server Status and API Connection lines are wording only and do not check anything. Press Initialize to enter. If saving is blocked in your browser, a red warning bar appears at the top once you are in, and Settings, Storage shows Blocked.</li><li>Open index.html from the same place each time. Some browsers may keep separate storage for each file location, so a copy opened from another folder can look empty. Export from the old copy and restore into the new one.</li></ul>"},
  {h:"If your data does not save",html:"<ul><li>A red bar at the top means the browser is blocking saving. This can happen in preview windows, private windows or when the page is opened inside another app.</li><li>Fix: save the file and open index.html directly in a normal browser window, for example by double-clicking it.</li><li>While saving is blocked, everything you enter is lost when the page reloads or closes. Use Export File or Copy Backup on the Settings tab to keep your work.</li></ul>"},
