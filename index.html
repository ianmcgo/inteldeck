function newsItemsFrom(j,max){
  const bad=a=>Array.isArray(a.category)&&a.category.some(c=>NEWS_BANNED.indexOf(String(c).toLowerCase())>=0);
  return j.results.filter(a=>a&&typeof a.title==="string"&&a.title&&!bad(a)).slice(0,max||NEWS_SHOW).map(a=>({
    i:typeof a.image_url==="string"&&/^https?:\/\//i.test(a.image_url)?a.image_url.slice(0,600):"",
    c:Array.isArray(a.category)?(a.category.map(x=>String(x).toLowerCase()).find(x=>x!=="top")||"top"):"top",
    t:a.title.slice(0,300),l:typeof a.link==="string"?a.link.slice(0,600):"",d:typeof a.description==="string"?a.description.replace(/\s+/g," ").trim().slice(0,260):"",
    s:typeof a.source_name==="string"?a.source_name.slice(0,60):(typeof a.source_id==="string"?a.source_id.slice(0,60):""),p:typeof a.pubDate==="string"?a.pubDate.slice(0,30):""
  }));
}

function newsSaveCache(ck,items){
  const cache=newsCache();
  cache[ck]={at:Date.now(),items:items};
  const keys=Object.keys(cache).sort((x,y)=>cache[y].at-cache[x].at).slice(0,6);
  const out={};
  keys.forEach(k=>{out[k]=cache[k]});
  Store.set("newsCache5",out);
}

const BridgeNews={busy:false,failAt:0};

async function newsCollect(qs){
  qs.set("size","10");
  const j=await fetchJson("https://newsdata.io/api/1/latest?"+qs.toString(),{},12000);
  if(!j||j.status!=="success"||!Array.isArray(j.results)){
    const e=new Error("api");
    e.apiMsg=j&&j.results&&j.results.message?String(j.results.message):"unexpected answer";
    throw e;
  }
  let items=newsItemsFrom(j,10);
  if(items.length<NEWS_SHOW&&typeof j.nextPage==="string"&&j.nextPage){
    try{
      qs.set("page",j.nextPage);
      const j2=await fetchJson("https://newsdata.io/api/1/latest?"+qs.toString(),{},12000);
      if(j2&&j2.status==="success"&&Array.isArray(j2.results)){
        const seen={};
        items.forEach(x=>{seen[x.l||x.t]=true});
        items=items.concat(newsItemsFrom(j2,10).filter(x=>!seen[x.l||x.t]));
      }
    }catch(e){}
  }
  return items.slice(0,NEWS_SHOW);
}

async function fetchBreaking(){
  if(BridgeNews.busy||Date.now()-BridgeNews.failAt<600000)return;
  const ck=["",NewsUI.country,"top"].join("|");
  const c=newsCache()[ck];
  if(c&&Date.now()-c.at<NEWS_FRESH)return;
  const key=newsKey();
  if(!key)return;
  BridgeNews.busy=true;
  const qs=new URLSearchParams({apikey:key,language:"en",country:NewsUI.country,category:"top"});
  try{
    newsSaveCache(ck,await newsCollect(qs));
  }catch(e){
    BridgeNews.failAt=Date.now();
  }
  BridgeNews.busy=false;
  if(currentTab==="bridge")renderBridge();
}

async function fetchNews(force){
  if(NewsUI.busy)return;
  const ck=newsKeyStr();
  const cache=newsCache();
  const c=cache[ck];
  if(!force&&c&&Date.now()-c.at<NEWS_FRESH){NewsUI.stale=false;NewsUI.msg="";renderNews();return}
  const key=newsKey();
  if(!key){NewsUI.msg="Add a NewsData key in Settings under Live Prices.";renderNews();return}
  NewsUI.busy=true;
  NewsUI.msg="Loading headlines...";
  renderNews();
  const qs=new URLSearchParams({apikey:key,language:"en"});
  if(NewsUI.q)qs.set("q",NewsUI.q);
  if(NewsUI.country)qs.set("country",NewsUI.country);
  if(NewsUI.category)qs.set("category",NewsUI.category);
  else qs.set("excludecategory",NEWS_BANNED.join(","));
  try{
    const items=await newsCollect(qs);
    newsSaveCache(ck,items);
    NewsUI.stale=false;
    NewsUI.msg=items.length?"":"No articles found for this search.";
  }catch(e){
    NewsUI.stale=!!c;
    NewsUI.msg="News: "+(e&&e.apiMsg?e.apiMsg:priceErr(e))+(c?". Showing the saved copy.":".");
  }
  NewsUI.busy=false;
  renderNews();
}

function openNews(){
  if(NewsUI.category!=="top"||NewsUI.q){
    NewsUI.category="top";
    NewsUI.q="";
    Store.set("newsPrefs",{q:"",country:NewsUI.country,category:"top"});
    if($("nwsCat"))$("nwsCat").value="top";
    if($("nwsQ"))$("nwsQ").value="";
  }
  renderNews();
  fetchNews(false);

function pickerTitle(sel){
  const l=sel.id?document.querySelector('label[for="'+sel.id+'"]'):null;
  return (l&&l.textContent.trim())||sel.getAttribute("aria-label")||"Choose";

function closePicker(){
  if(!Picker.el)return;
  const sel=Picker.sel;
  Picker.el.remove();
  Picker.el=null;
  Picker.sel=null;
  if(sel&&sel.focus)sel.focus({preventScroll:true});
}

function openPicker(sel){
  if(Picker.el||sel.disabled)return;
  const opts=[...sel.options].filter(o=>!o.disabled);
  if(!opts.length)return;
  const wrap=document.createElement("div");
  wrap.className="pickwrap";
  const box=document.createElement("div");
  box.className="pickbox";
  box.setAttribute("role","listbox");
  const h=document.createElement("h3");
  h.textContent=pickerTitle(sel);
  box.appendChild(h);
  opts.forEach(o=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="opt"+(o.value===sel.value?" on":"");
    b.setAttribute("role","option");
    b.textContent=o.textContent;
    b.dataset.val=o.value;
    box.appendChild(b);
  });
  wrap.appendChild(box);
  wrap.addEventListener("click",e=>{
    const b=e.target.closest(".opt");
    if(b){
      const el=Picker.sel;
      const v=b.dataset.val;
      closePicker();
      if(el.value!==v){
        el.value=v;
        el.dispatchEvent(new Event("input",{bubbles:true}));
        el.dispatchEvent(new Event("change",{bubbles:true}));
      }
      Sound.play("click");
    }else if(e.target===wrap){
      closePicker();
    }
  });
  wrap.addEventListener("keydown",e=>{
    const list=[...box.querySelectorAll(".opt")];
    const i=list.indexOf(document.activeElement);
    if(e.key==="ArrowDown"){e.preventDefault();(list[Math.min(list.length-1,i+1)]||list[0]).focus()}
    else if(e.key==="ArrowUp"){e.preventDefault();(list[Math.max(0,i-1)]||list[0]).focus()}
  });
  document.body.appendChild(wrap);
  Picker.el=wrap;
  Picker.sel=sel;
  Picker.at=Date.now();
  const on=box.querySelector(".opt.on")||box.querySelector(".opt");
  if(on){on.focus({preventScroll:true});on.scrollIntoView({block:"center"})}
  Sound.play("open");
}

function pickerGesture(e){
  const sel=e.target&&e.target.closest?e.target.closest("select"):null;
  if(!sel)return;
  e.preventDefault();
  if(e.type==="mousedown"||e.type==="touchend"||e.type==="click"){
    if(Picker.el||Date.now()-Picker.at<300)return;
    sel.focus({preventScroll:true});
    openPicker(sel);
  }
}

document.addEventListener("mousedown",pickerGesture,true);
document.addEventListener("click",pickerGesture,true);
document.addEventListener("touchend",pickerGesture,{capture:true,passive:false});
document.addEventListener("keydown",e=>{
  if(Picker.el&&e.key==="Escape"){
    e.preventDefault();
    e.stopImmediatePropagation();
    closePicker();
    return;
  }
  const t=e.target;
  if(t&&t.tagName==="SELECT"&&!Picker.el&&(e.key==="Enter"||e.key===" "||e.key==="F4"||(e.altKey&&e.key==="ArrowDown"))){
    e.preventDefault();
    openPicker(t);
  }
},true);

function suggClose(){

function suggOptions(inp){
  const dl=document.getElementById(inp.dataset.list);

}

function suggShow(inp){
  const multi=inp.id==="nwTags";
  const segs=inp.value.split(",");
  const cur=(multi?segs[segs.length-1]:inp.value).trim().toLowerCase();
  const items=suggOptions(inp).filter(v=>v.toLowerCase()!==cur&&(!cur||v.toLowerCase().indexOf(cur)>=0)).slice(0,8);
  if(!items.length||document.activeElement!==inp){suggClose();return}
  if(!Sugg.el){
    Sugg.el=document.createElement("div");
    Sugg.el.className="sugg";
    Sugg.el.addEventListener("mousedown",e=>e.preventDefault());
    Sugg.el.addEventListener("click",e=>{
      const b=e.target.closest("button");
      const el=Sugg.inp;
      if(!b||!el)return;
      const m=el.id==="nwTags";
      const parts=el.value.split(",");
      if(m){parts.pop();parts.push(b.dataset.v);el.value=parts.map(x=>x.trim()).filter(Boolean).join(", ")+", "}
      else el.value=b.dataset.v;
      el.dispatchEvent(new Event("input",{bubbles:true}));
      suggClose();
      Sound.play("click");
    });
    document.body.appendChild(Sugg.el);
  }
  Sugg.inp=inp;
  Sugg.el.innerHTML=items.map(v=>'<button type="button" data-v="'+esc(v)+'">'+esc(v)+"</button>").join("");
  const r=inp.getBoundingClientRect();
  const z=Prefs.uiSize/100;

  Sugg.el.style.top=(r.bottom+2)/z+"px";
  Sugg.el.style.width=r.width/z+"px";
}

function stripLists(root){
  const base=root&&root.querySelectorAll?root:document;
  const found=Array.from(base.querySelectorAll("input[list]"));
  if(base!==document&&base.matches&&base.matches("input[list]"))found.push(base);
  found.forEach(i=>{
    i.dataset.list=i.getAttribute("list");
    i.removeAttribute("list");
  });
}

function formatPhone(v){
  const raw=String(v||"");
  if(/[a-z+]/i.test(raw))return raw;
  const d=raw.replace(/\D/g,"");
  const f=x=>x.length<=3?x:x.length<=6?x.slice(0,3)+"-"+x.slice(3):x.slice(0,3)+"-"+x.slice(3,6)+"-"+x.slice(6);
  if(d.length===11&&d[0]==="1")return "1-"+f(d.slice(1));
  if(d.length>10)return raw;
  return f(d);
}

const INVERSE_LABELS={friend:"Friend","best friend":"Best friend",spouse:"@spouse",husband:"@spouse",wife:"@spouse",partner:"Partner",boyfriend:"Partner",girlfriend:"Partner",
  sibling:"@sib",brother:"@sib",sister:"@sib",cousin:"Cousin",coworker:"=",unknown:"=",colleague:"Colleague",neighbor:"Neighbor",roommate:"Roommate",classmate:"Classmate",teammate:"Teammate",
  parent:"@child",mother:"@child",father:"@child",mom:"@child",dad:"@child",child:"@parent",son:"@parent",daughter:"@parent",
  grandparent:"@grandchild",grandmother:"@grandchild",grandfather:"@grandchild",grandchild:"@grandparent",grandson:"@grandparent",granddaughter:"@grandparent",
  boss:"Employee",manager:"Employee",supervisor:"Employee",employee:"Boss",aunt:"@nibling",uncle:"@nibling",niece:"@auncle",nephew:"@auncle",
  mentor:"Mentee",mentee:"Mentor",teacher:"Student",student:"Teacher"};

function inverseLabel(l,g){
  const typed=String(l||"").trim();
  const key=typed.toLowerCase();
  const v=INVERSE_LABELS[key]||INVERSE_LABELS[key.replace(/[\s-]+/g,"")]||"";
  if(v==="=")return typed;
  if(v.charAt(0)!=="@")return v;
  const r=GENDERED_ROLES[v.slice(1)];
  return g==="male"?r[0]:g==="female"?r[1]:r[2];
}

function unlinkedPeople(p){
  return Data.people.filter(q=>q.id!==p.id&&!(p.rels||[]).some(r=>r.pid===q.id)&&!(q.rels||[]).some(r=>r.pid===p.id));
}

function boredMissing(p){
  const out=[];
  BORED_FIELDS.forEach(f=>{
    if(scribeOff(f))return;
    let miss;
    if(f==="tags")miss=!(p.tags&&p.tags.length);
    else if(f==="rels")miss=unlinkedPeople(p).length>0;
    else miss=!String(p[f]||"").trim();
    if(miss&&!Bored.skip[p.id+":"+f])out.push(f);
  });
  return out;
}

function boredTasks(){
  if(Prefs.scribeOff.tasktags)return [];
  return Data.todos.filter(t=>!t.done&&!(t.tags&&t.tags.length)&&!Bored.skip[t.id+":tasktags"]);
}

function boredCounts(){
  let n=0;
  let ppl=0;
  Data.people.forEach(p=>{
    const m=boredMissing(p).length;
    if(m){n+=m;ppl++}
  });
  const tk=boredTasks().length;
  return {n:n+tk,ppl:ppl,tasks:tk};

}

function boredSave(ty){
  const pick=Bored.cur;
  if(!pick)return;
  const p=boredItem(pick);
  if(!p)return;
  const f=pick.field;
  let v=f==="birthday"?getBday("bAns"):($("bAns").value||"").trim();
  if(!v){
    Sound.play("error");
    $("bAns").focus();
    return;
  }
  if(f==="phone")v=formatPhone(v);
  if(f==="tasktags"){
    const t=cleanTagList(v.split(","),10);
    if(!t.length){Sound.play("error");return}
    p.tags=cleanTagList((p.tags||[]).concat(t),10);
    rememberTags(t);
    Data.save("todos");
    Sound.play("confirm");
    if($("todoList"))refreshProjectsView();
    renderBored();
    return;
  }
  if(f==="tags"){
    const t=cleanTagList(v.split(","),10);
    if(!t.length){Sound.play("error");return}
    p.tags=cleanTagList((p.tags||[]).concat(t),20);
    if(ty&&TAG_TYPES.some(x=>x[0]===ty)){
      const m=Object.assign({},p.tagTypes);
      t.forEach(x=>{if(p.tags.indexOf(x)>=0)m[x]=ty});
      p.tagTypes=cleanTagTypes(m,p.tags);
    }
    rememberTags(t);
  }else if(f==="rels"){
    const label=($("bAns2").value||"").trim();
    const back=($("bAns3").value||"").trim();
    const q=personById(v);
    if(!q||q.id===p.id||unlinkedPeople(p).indexOf(q)<0){
      Sound.play("error");
      return;
    }
    if(!label){
      Sound.play("error");
      $("bAns2").focus();
      return;
    }
    p.rels=(p.rels||[]).concat([{pid:q.id,label:label.slice(0,40)}]);
    if(back)q.rels=(q.rels||[]).concat([{pid:p.id,label:back.slice(0,40)}]);
  }else if(f==="gender"){
    if(GENDERS.indexOf(v)<0){Sound.play("error");return}
    p.gender=v;
  }else if(f==="birthday"){
    if(!bdayOk(v)){Sound.play("error");return}
    p.birthday=v;
  }else{
    p[f]=v;
    if(f==="first"||f==="middle"||f==="last")p.name=joinName(p.first,p.middle,p.last);
  }
  Data.save("people");
  Sound.play("confirm");
  if($("pList")){
    fillPersonEditor();
    renderPeopleList();
  }
  renderBored();
}

function openBored(){
  openModal("Scribe Data","");
  renderBored();
}

function boredClick(e){
  const b=e.target.closest("[data-bored]");
  if(!b)return;
  const a=b.dataset.bored;
  if(a==="skip"){
    if(Bored.cur)Bored.skip[Bored.cur.pid+":"+Bored.cur.field]=1;
    Sound.play("click");
    renderBored();
  }else if(a==="off"){
    if(Bored.cur){
      Prefs.scribeOff[scribeType(Bored.cur.field)]=true;
      Store.set("scribeOff",Prefs.scribeOff);
      syncScribeOpts();
    }
    Sound.play("close");
    renderBored();
  }else if(a.indexOf("tt-")===0){
    boredSave(a.slice(3));
  }else if(a==="gm"||a==="gf"){
    boredGender(a==="gm"?"male":"female");
  }else if(a==="done"){
    closeModal();
  }else if(a==="reset"){
    Bored.skip={};
    Sound.play("click");
    renderBored();
  }else if(a==="people"){
    closeModal();
    showTab("people");
  }
}

const Updater={busy:false,last:0,latest:"",hideUntil:0};
const verNum=v=>String(v).split(".").map(n=>parseInt(n,10)||0);
function verNewer(a,b){
  const x=verNum(a),y=verNum(b);
  for(let i=0;i<3;i++){
    if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0);
  }
  return false;
}
function updHosted(){return /^https?:$/.test(location.protocol)}
async function updCheck(force,manual){
  if(!updHosted())return "file";
  if(Updater.busy)return "busy";
  if(!navigator.onLine)return "offline";
  if(!force&&Date.now()-Updater.last<60000)return "skip";
  Updater.busy=true;
  Updater.last=Date.now();
  let res="same";
  try{
    const u=new URL(location.href);
    u.hash="";
    u.search="";
    u.searchParams.set("_chk",String(Date.now()));
    const r=await fetch(u.href,{cache:"no-store"});
    if(!r.ok)throw new Error("http");
    const t=await r.text();
    const m=t.match(/const VERSION="([0-9]+\.[0-9]+\.[0-9]+)"/);
    const b=t.match(/const BUILT="([^"]+)"/);
    if(!m)res="error";
    else if(verNewer(m[1],VERSION)){
      Updater.latest=m[1];
      res="new";
      if(manual)Updater.hideUntil=0;
      updShow(m[1],b?b[1]:"");
    }
  }catch(e){
    res="error";
  }
  Updater.busy=false;
  return res;
}
function updShow(v,b){
  if(Date.now()<Updater.hideUntil)return;
  const el=$("verPop");
  if(el.classList.contains("open"))return;
  el.innerHTML="<b>New version available</b><p>IntelDeck v"+esc(v)+(b?" ("+esc(b)+")":"")+" is ready. You are using v"+esc(VERSION)+". Press Refresh Now to load it. Anything typed into an open window that you have not saved will be lost.</p><div class=\"acts\"><button type=\"button\" class=\"btn\" data-upd=\"go\">Refresh Now</button><button type=\"button\" class=\"btn\" data-upd=\"later\">Later</button></div>";
  el.classList.add("open");
  Sound.play("open");
}
async function updRefresh(btn){
  btn.disabled=true;
  btn.textContent="Refreshing...";
  try{flushDrafts()}catch(e){}
  try{
    if(syncOn()&&Sync.ready&&Store.get("syncDirty",false)===true){
      await Promise.race([syncUpload(),new Promise(r=>setTimeout(r,4000))]);
    }
  }catch(e){}
  location.reload();
}
function updClick(e){
  const b=e.target.closest("[data-upd]");
  if(!b)return;
  const k=b.dataset.upd;
  if(k==="go"){Sound.play("click");updRefresh(b)}
  else if(k==="later"){
    Sound.play("click");
    Updater.hideUntil=Date.now()+30*60000;
    $("verPop").classList.remove("open");
  }else if(k==="check"){
    Sound.play("click");
    const out=$("updChkOut");
    out.textContent="Checking...";
    updCheck(true,true).then(r=>{
      out.textContent=({
        file:"This copy was opened as a file, so it cannot check. It needs to be opened from a web address.",
        offline:"You are offline.",
        busy:"Already checking.",
        skip:"Checked a moment ago.",
        error:"Could not read the hosted file.",
        same:"You have the latest version (v"+VERSION+").",
        new:"A newer version (v"+Updater.latest+") was found."
      })[r]||"";
    });
  }
}
function updStart(){
  $("verPop").addEventListener("click",updClick);
  $("modalBody").addEventListener("click",updClick);
  setTimeout(()=>updCheck(false),4000);
  setInterval(()=>updCheck(true),10*60000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)updCheck(false)});
  window.addEventListener("online",()=>updCheck(false));
}

function obf(t){
  try{return btoa(unescape(encodeURIComponent(String(t)))).split("").reverse().join("")}catch(e){return ""}
}
function unobf(t){
  try{return decodeURIComponent(escape(atob(String(t).split("").reverse().join(""))))}catch(e){return ""}
}

async function supaAuth(path,body,token,method){
  const ctl=typeof AbortController==="function"?new AbortController():null;
  const timer=setTimeout(()=>{if(ctl)ctl.abort()},15000);
  const headers={"Content-Type":"application/json",apikey:SUPA.key};
  if(token)headers.Authorization="Bearer "+token;
  let r;
  try{
    r=await fetch(SUPA.url+"/auth/v1/"+path,Object.assign({method:method||"POST",headers:headers,body:JSON.stringify(body||{})},ctl?{signal:ctl.signal}:{}));
  }catch(e){
    clearTimeout(timer);
    const x=new Error("Could not reach the server. Check your internet connection.");
    x.net=true;
    throw x;
  }
  clearTimeout(timer);
  let j={};
  try{j=await r.json()}catch(e){j={}}
  if(!r.ok){
    const m=j.error_description||j.msg||j.message||j.error||("Server error "+r.status);
    const x=new Error(authMsg(String(m)));
    x.status=r.status;
    throw x;
  }
  return j;
}

function authMsg(m){
  if(/invalid login credentials/i.test(m))return "Wrong email or password.";
  if(/email not confirmed/i.test(m))return "Your email is not confirmed yet. Open the link in the email Supabase sent you, then log in.";
  if(/already registered|already been registered|user already exists/i.test(m))return "That email already has an account. Log in instead.";
  if(/password should be at least/i.test(m))return "The password is too short. Use at least 6 characters.";
  if(/rate limit|too many/i.test(m))return "Too many tries. Wait a minute and try again.";
  if(/invalid.*refresh|refresh token/i.test(m))return "Your saved sign in has expired. Please log in again.";
  return m;
}

function authKeep(j){
  Auth.session={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(Number(j.expires_in)||3600)*1000,email:j.user&&j.user.email||"",uid:j.user&&j.user.id||""};
}

async function authFresh(){
  const s=Auth.session;
  if(!s||!s.refresh)return null;
  if(s.exp-Date.now()>60000)return s;
  const j=await supaAuth("token?grant_type=refresh_token",{refresh_token:s.refresh});
  authKeep(j);
  return Auth.session;
}

async function authStart(){
  const h=new URLSearchParams(String(location.hash||"").replace(/^#/,""));
  if(h.get("type")==="recovery"&&h.get("access_token")){
    Auth.recover=h.get("access_token");
    showLogin("recover","Type a new password for your account.","ok");
    return;
  }
  if(h.get("error_description")){
    showLogin("login",h.get("error_description").replace(/\+/g," "),"err");
    return;
  }
  Store.remove("authSession");
  Store.set("authLocal",false);
  showLogin("login");
}

async function loginSubmit(){
  if(Auth.busy)return;
  const m=Auth.mode;
  const email=$("lgEmail").value.trim();
  const pass=$("lgPass").value;
  const pass2=$("lgPass2").value;
  const remember=$("lgRemember").checked;
  if(m!=="recover"&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){Sound.play("error");lgMsg("Type a valid email address.","err");$("lgEmail").focus();return}
  if(!pass){Sound.play("error");lgMsg("Type your password.","err");$("lgPass").focus();return}
  if(m!=="login"){
    if(pass.length<6){Sound.play("error");lgMsg("Use at least 6 characters for the password.","err");$("lgPass").focus();return}
    if(pass!==pass2){Sound.play("error");lgMsg("The two passwords do not match.","err");$("lgPass2").focus();return}
  }
  setLoginBusy(true,m==="create"?"Creating your account...":m==="recover"?"Saving your new password...":"Logging in...");
  try{
    if(m==="recover"){
      await supaAuth("user",{password:pass},Auth.recover,"PUT");
      Auth.recover="";
      try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
      setLoginBusy(false);
      $("lgPass").value="";
      $("lgPass2").value="";
      setLoginMode("login");
      Sound.play("confirm");
      lgMsg("Password changed. Log in with your new password.","ok");
      return;
    }
    const j=m==="create"?await supaAuth("signup",{email:email,password:pass}):await supaAuth("token?grant_type=password",{email:email,password:pass});
    setLoginBusy(false);
    if(remember)Store.set("authSaved",{e:email,p:obf(pass)});
    else Store.remove("authSaved");
    if(!j.access_token){
      setLoginMode("login");
      $("lgPass2").value="";
      Sound.play("confirm");
      lgMsg("Account created. Open the confirmation link in the email that was just sent to "+email+", then log in here.","ok");
      return;
    }
    authKeep(j);
    Store.set("authLocal",false);
    Sound.play("confirm");
    lgMsg("");
    enterApp();
  }catch(e){
    setLoginBusy(false);
    Sound.play("error");
    lgMsg(e.message,"err");
  }
}

const DATA_KEYS=["todos","projects","events","notes","people","playing","shelved","completed","assets","bills","debts","invest","tobuy"];
const LOOK_KEYS=["uiSize","textSize","uiOpacity"];
const Sync={ready:false,busy:false,applying:false,timer:0,retry:0,status:"",kind:"ok",pending:null,lastCheck:0};

function syncOn(){return !!(Auth.session&&Auth.session.uid)}

function localCount(){
  const autoTax=t=>t&&t.text==="File taxes"&&!t.done&&Array.isArray(t.tags)&&t.tags.length===1&&t.tags[0]==="taxes"&&t.rep&&t.rep.type==="years";
  return DATA_KEYS.reduce((n,k)=>n+(k==="todos"?Data.todos.filter(t=>!autoTax(t)).length:Array.isArray(Data[k])?Data[k].length:Object.keys(Data[k]||{}).filter(x=>Data[k][x]&&Data[k][x].title).length),0);
}

function payloadCount(d){
  if(!d||typeof d!=="object")return 0;
  return DATA_KEYS.reduce((n,k)=>n+(Array.isArray(d[k])?d[k].length:(d[k]&&typeof d[k]==="object"?Object.keys(d[k]).length:0)),0);
}

function setSync(text,kind){
  Sync.status=text||"";
  Sync.kind=kind||"ok";
  if($("syncState")){
    $("syncState").textContent=Sync.status;
    $("syncState").className="msg"+(Sync.status?" "+Sync.kind:"");
  }
}

async function supaRest(method,query,body,prefer){
  const s=await authFresh();
  if(!s)throw new Error("Not signed in.");
  const ctl=typeof AbortController==="function"?new AbortController():null;
  const timer=setTimeout(()=>{if(ctl)ctl.abort()},20000);
  const headers={"Content-Type":"application/json",apikey:SUPA.key,Authorization:"Bearer "+s.access};
  if(prefer)headers.Prefer=prefer;
  let r;
  try{
    r=await fetch(SUPA.url+"/rest/v1/"+query,Object.assign({method:method,headers:headers},body!==undefined?{body:JSON.stringify(body)}:{},ctl?{signal:ctl.signal}:{}));
  }catch(e){
    clearTimeout(timer);
    const x=new Error("Offline. Changes are kept on this device and upload when you are back online.");
    x.net=true;
    throw x;
  }
  clearTimeout(timer);
  let j=null;
  try{j=await r.json()}catch(e){j=null}
  if(!r.ok){
    const m=j&&(j.message||j.hint||j.error)||("Server error "+r.status);
    const x=new Error(/deck_data|relation .* does not exist|could not find the table/i.test(m)?"The deck_data table is missing in Supabase. Run the deck_data setup SQL in the Supabase SQL editor (see Help, Account and login).":/permission|row-level security|violates/i.test(m)?"Supabase refused access to your data. Check the deck_data security policies from Help.":m);
    x.status=r.status;
    throw x;
  }
  return j;
}

async function syncPull(){
  const rows=await supaRest("GET","deck_data?select=data,updated_at&user_id=eq."+encodeURIComponent(Auth.session.uid));
  return Array.isArray(rows)&&rows.length?rows[0]:null;
}

function syncPayload(){
  const p=exportPayload();
  if(p.data&&p.data.settings)LOOK_KEYS.forEach(k=>{delete p.data.settings[k]});
  return p;
}

async function syncPush(){
  const now=new Date().toISOString();
  const rows=await supaRest("POST","deck_data?on_conflict=user_id",[{user_id:Auth.session.uid,data:syncPayload(),updated_at:now}],"resolution=merge-duplicates,return=representation");
  const at=Array.isArray(rows)&&rows[0]&&rows[0].updated_at?Date.parse(rows[0].updated_at):Date.parse(now);
  Store.set("syncPulledAt",at);
  Store.set("syncDirty",false);
  Store.set("syncOwner",Auth.session.uid);
  return at;
}

function emptyPayload(){
  const p=exportPayload();
  DATA_KEYS.forEach(k=>{p.data[k]=k==="playing"?{}:[]});
  return p;
}

function syncApply(payload,at){
  const keep={};
  LOOK_KEYS.forEach(k=>{keep[k]=Prefs[k]});
  const v=validateImport(JSON.stringify(payload||emptyPayload()));
  if(!v.ok)throw new Error("The server copy could not be read: "+v.error);
  LOOK_KEYS.forEach(k=>{v.clean.settings[k]=keep[k]});
  Sync.applying=true;
  try{applyImport(v.clean)}finally{Sync.applying=false}
  Store.set("syncPulledAt",at||0);
  Store.set("syncDirty",false);
  Store.set("syncOwner",Auth.session.uid);
}

function syncMark(){
  if(Sync.applying||!syncOn()||!Sync.ready)return;
  Store.set("syncDirty",true);
  Store.set("syncLocalAt",Date.now());
  clearTimeout(Sync.timer);
  Sync.timer=setTimeout(syncUpload,3000);
  setSync("Changes waiting to upload...","ok");
}

async function syncUpload(){
  if(!syncOn()||!Sync.ready||Sync.busy)return;
  if(Store.get("syncDirty",false)!==true)return;
  Sync.busy=true;
  setSync("Saving to your account...","ok");
  try{
    await syncPush();
    setSync("Saved to your account "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+".","ok");
  }catch(e){
    setSync(e.message,e.net?"ok":"err");
    clearTimeout(Sync.retry);
    Sync.retry=setTimeout(syncUpload,60000);
  }
  Sync.busy=false;
}

async function syncCheck(force){
  if(!syncOn()||!Sync.ready||Sync.busy)return;
  if(!force&&Date.now()-Sync.lastCheck<30000)return;
  Sync.lastCheck=Date.now();
  Sync.busy=true;
  try{
    const row=await syncPull();
    const serverAt=row?Date.parse(row.updated_at)||0:0;
    const dirty=Store.get("syncDirty",false)===true;
    const localAt=Store.get("syncLocalAt",0);
    if(dirty&&(!row||localAt>=serverAt)){
      Sync.busy=false;
      await syncUpload();
      return;
    }
    if(row&&serverAt>Store.get("syncPulledAt",0)){
      syncApply(row.data,serverAt);
      setSync("Updated from your account "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+".","ok");
    }else if(!dirty){
      setSync("Up to date with your account.","ok");
    }
  }catch(e){
    setSync(e.message,e.net?"ok":"err");
  }
  Sync.busy=false;
}

async function syncStart(){
  if(!syncOn())return;
  Sync.ready=false;
  Sync.pending=null;
  setSync("Checking your account...","ok");
  const uid=Auth.session.uid;
  let row;
  try{
    row=await syncPull();
  }catch(e){
    if(e.net&&Store.get("syncOwner","")===uid){
      Sync.ready=true;
      setSync(e.message,"ok");
    }else{
      setSync(e.net?"Offline. Your account will be checked when you are back online.":e.message,e.net?"ok":"err");
    }
    return;
  }
  if(!syncOn()||Auth.session.uid!==uid)return;
  const serverAt=row?Date.parse(row.updated_at)||0:0;
  if(Store.get("syncOwner","")===uid){
    Sync.ready=true;
    Sync.lastCheck=0;
    await syncCheck(true);
    return;
  }
  if(localCount()>0){
    Sync.pending={row:row,at:serverAt};
    setSync("Waiting for you to choose what to keep.","ok");
    openSyncChoice();
    return;
  }
  try{
    syncApply(row?row.data:null,serverAt);
    Sync.ready=true;
    setSync(row?"Loaded your data from your account.":"Your account is empty. Anything you add now saves to it.","ok");
  }catch(e){
    setSync(e.message,"err");
  }
}

function openSyncChoice(){
  const p=Sync.pending;
  if(!p)return;
  const n=localCount();
  const sn=p.row?payloadCount(p.row.data&&p.row.data.data):0;
  Armed.key="";
  openModal("Data on This Device",
    '<p style="margin:0 0 10px">This device has <b>'+n+"</b> saved item"+(n===1?" that is":"s that are")+" not from your account. "+(p.row?"Your account has <b>"+sn+"</b> item"+(sn===1?"":"s")+(p.at?", last saved "+esc(new Date(p.at).toLocaleString([],{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"})):"")+".":"Your account is <b>empty</b>.")+"</p>"+
    '<p class="hint">Choose which copy to keep. Either way the data on this device is then cleared and replaced by your account copy, so nothing on the server is lost by accident.</p>'+
    '<label class="chk" style="margin:0 0 12px"><input type="checkbox" id="syncBk" checked> Download a backup file of this device\'s data first</label>'+
    '<div class="row"><button type="button" class="btn" data-sync="keep">Delete Local Data, Keep Account</button><button type="button" class="btn amber" data-sync="replace">Replace Account With This Device</button></div>'+
    '<p class="msg" id="syncChoiceMsg" role="status"></p>');
}

async function syncChoose(which,btn){
  const p=Sync.pending;
  if(!p||Sync.busy)return;
  if(which==="replace"&&Armed.key!=="sync:replace"){
    Armed.key="sync:replace";
    btn.textContent="Sure? Replace Account";
    Sound.play("click");
    $("syncChoiceMsg").textContent=p.row?"This overwrites everything saved in your account. Press again to confirm.":"Press again to upload this device's data to your account.";
    $("syncChoiceMsg").className="msg err";
    return;
  }
  Armed.key="";
  if($("syncBk")&&$("syncBk").checked)doExport();
  Sync.busy=true;
  $("syncChoiceMsg").textContent=which==="replace"?"Uploading this device's data...":"Loading your account...";
  $("syncChoiceMsg").className="msg ok";
  try{
    if(which==="replace"){
      const at=await syncPush();
      const row=await syncPull();
      syncApply(row?row.data:syncPayload(),row?Date.parse(row.updated_at)||at:at);
    }else{
      syncApply(p.row?p.row.data:null,p.at);
    }
    Sync.pending=null;
    Sync.ready=true;
    Sync.busy=false;
    Sound.play("confirm");
    closeModal(true);
    setSync(which==="replace"?"This device's data is now saved in your account.":"Loaded your data from your account.","ok");
    syncAccountUi();
  }catch(e){
    Sync.busy=false;
    Sound.play("error");
    $("syncChoiceMsg").textContent=e.message;
    $("syncChoiceMsg").className="msg err";
  }
}

function clearLocalData(){
  const keep={};
  LOOK_KEYS.forEach(k=>{keep[k]=Prefs[k]});
  const v=validateImport(JSON.stringify(emptyPayload()));
  LOOK_KEYS.forEach(k=>{v.clean.settings[k]=keep[k]});
  Sync.applying=true;
  try{applyImport(v.clean)}finally{Sync.applying=false}
  ["syncOwner","syncDirty","syncLocalAt","syncPulledAt"].forEach(k=>Store.remove(k));
}

function syncAccountUi(){
  if(!$("acctState"))return;

      }else if(b.dataset.pop==="assetvehicle"){
        Sound.play("click");
        openPopup("vehicle");
      }else if(b.dataset.pop==="mefill"){
        Sound.play("click");
        openPopup("person","","me");
      }else if(b.dataset.pop==="menot"){
        Sound.play("click");
        closeModal(true);
      }else if(b.dataset.pop==="mepick"){
        const v=$("mePick").value;
        if(!v){Sound.play("error");return}
        setMe(v);
        Data.save("people");
        Sound.play("confirm");
        closeModal(true);
        selectPerson(v);
      }else if(b.dataset.pop==="cancel"){
        Sound.play("click");
        closeModal(true);
      }else if(b.dataset.pop==="notecopy"||b.dataset.pop==="noteexport"){
        const n=Data.notes.find(x=>x.id===Popup.id);
        if(n){
          if(b.dataset.pop==="notecopy")copyNote(n,b);
          else exportNote(n);
        }
      }else if(b.dataset.pop==="noteedit"){
        Sound.play("click");
        openPopup("noteedit",Popup.id);
      }else if(b.dataset.pop==="clearsearch"){
        NoteUI.q="";
        Sound.play("click");
        closeModal(true);
        renderNoteList();
      }else if(b.dataset.pop==="addperson"){
        const v=$("nwPersonSel").value;
        if(v&&Popup.people.indexOf(v)<0){
          Popup.people.push(v);
          Sound.play("click");
          renderPopupPeople();
        }else{
          Sound.play("error");
        }
      }
      return;
    }
    const d=e.target.closest("[data-popdel]");
    if(d){
      Popup.people.splice(Number(d.dataset.popdel),1);
      Sound.play("remove");
      renderPopupPeople();
    }
  });
  $("modalBody").addEventListener("keydown",e=>{
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)&&e.target.id==="nwBody"){
      e.preventDefault();
      popupSave();
    }
  });
  $("fab").addEventListener("click",()=>{
    Sound.play("click");
    openPopup($("fab").dataset.kind);
  });
  $("modalBody").addEventListener("submit",e=>{
    if(e.target.id==="bForm"){
      e.preventDefault();
      boredSave();
    }else if(e.target.id==="nwForm"){
      e.preventDefault();
      popupSave();
    }
  });
  $("view-bridge").addEventListener("keydown",e=>{
    if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("bt"))e.target.click();
  });
  $("view-bridge").addEventListener("click",e=>{
    const ba=e.target.closest("[data-bact]");
    if(ba){
      const row=ba.closest("[data-tid]");
      const t=row&&Data.todos.find(x=>x.id===row.dataset.tid);
      if(t){
        if(ba.dataset.bact==="done"){
          setTaskDone(t,true);
          Sound.play("complete");
        }else{
          t.paused=true;
          Sound.play("close");
        }
        Data.save("todos");
        renderBridge();
      }
      return;
    }
    if(e.target.closest("#boredBtn")){
      openBored();
      return;
    }
    const go=e.target.closest("[data-go]");
    if(go){
      showTab(go.dataset.go);
      if(go.dataset.go==="todo")showProjSub("tasks");
      if(go.dataset.date)selectDate(go.dataset.date);
    }
  });
  $("modalWrap").addEventListener("click",e=>{if(e.target===$("modalWrap"))closeModal()});
  document.querySelectorAll(".btn").forEach(b=>b.addEventListener("mouseenter",()=>Sound.play("hover")));

  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){if($("login").classList.contains("gone"))closeModal();return}
    if(typing(document.activeElement)||e.ctrlKey||e.metaKey||e.altKey)return;
    if(!$("app").classList.contains("live")||$("modalWrap").classList.contains("open")||!$("login").classList.contains("gone"))return;
    const k=e.key.toLowerCase();
    if(k>="0"&&k<="9"){
      const m=MODULES[k==="0"?9:Number(k)-1];
      if(m)showTab(m.id);
    }else if(k==="h"){showHelp()}
    else if(k==="u"){showUpdates()}
    else if(k==="m"){toggleMute()}
    else if(k==="n"){newItemShortcut(e)}
    else if(k==="/"){searchShortcut(e)}
  });
}
init();
</script>
</body>
</html>
