const Store={
  prefix:"ianverse:",
  get(key,fallback){
    try{
      const raw=localStorage.getItem(this.prefix+key);
      return raw===null?fallback:JSON.parse(raw);
    }catch(e){return fallback}
  },
  set(key,value){
    try{
      localStorage.setItem(this.prefix+key,JSON.stringify(value));
      return true;
    }catch(e){return false}
  },
  remove(key){
    try{localStorage.removeItem(this.prefix+key)}catch(e){}
  },
  keys(){
    const out=[];
    try{
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k&&k.indexOf(this.prefix)===0)out.push(k.slice(this.prefix.length));
      }
    }catch(e){}
    return out;
  },
  bytes(){
    let n=0;
    try{
      this.keys().forEach(k=>{
        const v=localStorage.getItem(this.prefix+k)||"";
        n+=(this.prefix.length+k.length+v.length)*2;
      });
    }catch(e){}
    return n;
  },
  works(){
    try{
      localStorage.setItem(this.prefix+"__probe","1");
      localStorage.removeItem(this.prefix+"__probe");
      return true;
    }catch(e){return false}
  }
};

const THEMES=[["cyan","Cyan","#4df2ff","#2b8cff"],["green","Green","#4dffa8","#1fbf6f"],["amber","Amber","#ffb347","#ff8a1f"],["magenta","Magenta","#ff6ec7","#c23bff"],["red","Red","#ff6b7a","#e0243b"],["violet","Violet","#b69bff","#7a4dff"],["white","White","#e6f2ff","#8aa4c8"]];

const Theme={id:"cyan",primary:"#4df2ff",secondary:"#2b8cff",cyanRgb:"77,242,255",blueRgb:"43,140,255"};

const hexRgb=h=>{
  const m=/^#([0-9a-f]{6})$/i.exec(String(h||""));
  if(!m)return null;
  const n=parseInt(m[1],16);
  return [(n>>16)&255,(n>>8)&255,n&255];
};
const rgbHex=a=>"#"+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");

function themeFrom(id,primary){
  const preset=THEMES.find(t=>t[0]===id);
  if(preset)return {id:preset[0],primary:preset[2],secondary:preset[3]};
  const rgb=hexRgb(primary);
  if(!rgb)return {id:"cyan",primary:THEMES[0][2],secondary:THEMES[0][3]};
  return {id:"custom",primary:rgbHex(rgb),secondary:rgbHex(rgb.map(v=>v*0.68))};
}

function applyTheme(t){
  const p=hexRgb(t.primary);
  const sc=hexRgb(t.secondary);
  if(!p||!sc)return;
  Theme.id=t.id;
  Theme.primary=t.primary;
  Theme.secondary=t.secondary;
  Theme.cyanRgb=p.join(",");
  Theme.blueRgb=sc.join(",");
  const st=document.documentElement.style;
  st.setProperty("--cyan",t.primary);
  st.setProperty("--blue",t.secondary);
  st.setProperty("--deep",rgbHex(sc.map(v=>v*0.45)));
  st.setProperty("--cyan-rgb",Theme.cyanRgb);
  st.setProperty("--blue-rgb",Theme.blueRgb);
}

(function(){
  const v=Store.get("theme",null);
  if(v&&typeof v==="object")applyTheme(themeFrom(v.id,v.primary));
})();

const Sound={
  ctx:null,master:null,
  muted:Store.get("muted",false),
  vol:Store.get("volume",0.6),
  lastHover:0,
  init(){
    if(this.ctx)return;
    try{
      const C=window.AudioContext||window.webkitAudioContext;
      if(!C)return;
      this.ctx=new C();
      this.master=this.ctx.createGain();
      this.master.gain.value=this.muted?0:this.vol;
      this.master.connect(this.ctx.destination);
    }catch(e){this.ctx=null}
  },
  resume(){
    if(this.ctx&&this.ctx.state==="suspended")this.ctx.resume();
  },
  apply(){
    if(this.master)this.master.gain.value=this.muted?0:this.vol;
  },
  setMuted(m){
    this.muted=m;
    Store.set("muted",m);
    this.apply();
  },
  setVol(v){
    this.vol=v;
    Store.set("volume",v);
    this.apply();
  },
  tone(freq,dur,type,gain,delay,slideTo){
    if(!this.ctx||this.muted)return;
    const t=this.ctx.currentTime+(delay||0);
    const o=this.ctx.createOscillator();
    const g=this.ctx.createGain();
    o.type=type||"sine";
    o.frequency.setValueAtTime(freq,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(gain||0.2,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);
    g.connect(this.master);
    o.start(t);
    o.stop(t+dur+0.02);
  },
  noise(dur,gain,delay,cutoff){
    if(!this.ctx||this.muted)return;
    const t=this.ctx.currentTime+(delay||0);
    const len=Math.floor(this.ctx.sampleRate*dur);
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<len;i++)data[i]=Math.random()*2-1;
    const src=this.ctx.createBufferSource();
    src.buffer=buf;
    const f=this.ctx.createBiquadFilter();
    f.type="lowpass";
    f.frequency.setValueAtTime(cutoff||2400,t);
    f.frequency.exponentialRampToValueAtTime(200,t+dur);
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(gain||0.1,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f);
    f.connect(g);
    g.connect(this.master);
    src.start(t);
  },
  play(name){
    if(!this.ctx)return;
    this.resume();
    switch(name){
      case "click":
        this.tone(880,0.06,"square",0.12);
        this.tone(1320,0.05,"square",0.06,0.02);
        break;
      case "hover":
        {
          const now=performance.now();
          if(now-this.lastHover<90)return;
          this.lastHover=now;
          this.tone(1900,0.03,"sine",0.03);
        }
        break;
      case "nav":
        this.tone(520,0.09,"triangle",0.18,0,820);
        this.noise(0.08,0.04,0,3000);
        break;
      case "confirm":
        this.tone(660,0.1,"triangle",0.18);
        this.tone(880,0.1,"triangle",0.18,0.09);
        this.tone(1320,0.18,"triangle",0.16,0.18);
        break;
      case "error":
        this.tone(220,0.26,"sawtooth",0.14,0,110);
        this.tone(165,0.26,"square",0.08,0.05,90);
        break;
      case "open":
        this.tone(300,0.28,"sine",0.18,0,1000);
        this.noise(0.25,0.05,0,3500);
        break;
      case "close":
        this.tone(1000,0.24,"sine",0.16,0,300);
        break;
      case "complete":
        this.tone(523,0.09,"triangle",0.18);
        this.tone(784,0.09,"triangle",0.18,0.08);
        this.tone(1047,0.22,"sine",0.18,0.16);
        break;
      case "remove":
        this.tone(440,0.18,"sawtooth",0.1,0,120);
        this.noise(0.18,0.05,0,1800);
        break;
      case "mute":
        this.tone(500,0.08,"square",0.1);
        break;
      case "boot":
        [220,330,440,660,880].forEach((f,i)=>this.tone(f,0.16,"triangle",0.16,i*0.1));
        this.tone(1320,0.6,"sine",0.16,0.55);
        this.tone(1760,0.6,"sine",0.1,0.6);
        this.noise(0.7,0.07,0,5000);
        break;
    }
  }
};

(function starfield(){
  const canvas=document.getElementById("stars");
  const g=canvas.getContext("2d");
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const motion=reduce?0.12:1;
  let W=0,H=0,layers=[],blobs=[],last=performance.now(),running=true;
  const specs=[
    {speed:10,size:1,alpha:0.45,density:0.00018,streak:0},
    {speed:28,size:1.4,alpha:0.7,density:0.00009,streak:0},
    {speed:75,size:1.8,alpha:0.95,density:0.00004,streak:10}
  ];
  const tints=["#ffffff","#bfe6ff","#9fd0ff","#ffe9c4","#c9f9ff"];
  function build(){
    layers=specs.map(s=>{
      const n=Math.max(20,Math.floor(W*H*s.density));
      const stars=[];
      for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,c:tints[Math.floor(Math.random()*tints.length)],tw:Math.random()*Math.PI*2});
      return {spec:s,stars};
    });
    blobs=[
      {x:W*0.25,y:H*0.35,r:Math.max(W,H)*0.45,c:"43,140,255",t:"b",a:0.11,v:2.2},
      {x:W*0.8,y:H*0.7,r:Math.max(W,H)*0.4,c:"120,60,200",a:0.08,v:3.4},
      {x:W*0.55,y:H*0.1,r:Math.max(W,H)*0.3,c:"77,242,255",t:"c",a:0.06,v:1.6}
    ];
  }
  function resize(){
    const r=window.devicePixelRatio||1;
    W=window.innerWidth;
    H=window.innerHeight;
    canvas.width=Math.floor(W*r);
    canvas.height=Math.floor(H*r);
    g.setTransform(r,0,0,r,0,0);
    build();
  }
  const bgCanvas=document.createElement("canvas");
  const bg=bgCanvas.getContext("2d");
  let bgAt=0,quietUntil=0;
  function quiet(ms){quietUntil=performance.now()+ms}
  document.addEventListener("scroll",()=>quiet(180),true);
  document.addEventListener("keydown",()=>quiet(700),true);
  document.addEventListener("input",()=>quiet(700),true);
  document.addEventListener("touchmove",()=>quiet(180),{capture:true,passive:true});
  function paintBg(now){
    const r=window.devicePixelRatio||1;
    if(bgCanvas.width!==Math.floor(W*r)||bgCanvas.height!==Math.floor(H*r)){
      bgCanvas.width=Math.floor(W*r);
      bgCanvas.height=Math.floor(H*r);
    }
    bg.setTransform(r,0,0,r,0,0);
    bg.fillStyle="#02050d";
    bg.fillRect(0,0,W,H);
    blobs.forEach(b=>{
      const grad=bg.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
      const bc=b.t==="b"?Theme.blueRgb:b.t==="c"?Theme.cyanRgb:b.c;
      grad.addColorStop(0,"rgba("+bc+","+b.a+")");
      grad.addColorStop(1,"rgba("+bc+",0)");
      bg.fillStyle=grad;
      bg.fillRect(0,0,W,H);
    });
    bgAt=now;
  }
  function modalOpen(){
    return document.getElementById("modalWrap").classList.contains("open");
  }
  function frame(now){
    if(!running)return;
    if(now<quietUntil||now-last<30||modalOpen()){requestAnimationFrame(frame);return}
    const dt=Math.min(0.1,(now-last)/1000);
    last=now;
    blobs.forEach(b=>{
      b.x-=b.v*dt*motion;
      if(b.x<-b.r*0.5)b.x=W+b.r*0.5;
    });
    if(now-bgAt>1000||!bgAt)paintBg(now);
    g.setTransform(1,0,0,1,0,0);
    g.drawImage(bgCanvas,0,0);
    const r0=window.devicePixelRatio||1;
    g.setTransform(r0,0,0,r0,0,0);
    layers.forEach(l=>{
      const s=l.spec;
      l.stars.forEach(st=>{
        st.x-=s.speed*dt*motion;
        if(st.x<-s.streak-2){st.x=W+2;st.y=Math.random()*H}
        st.tw+=dt*2;
        g.globalAlpha=s.alpha*(0.7+0.3*Math.sin(st.tw));
        g.fillStyle=st.c;
        g.fillRect(st.x,st.y,s.size+(s.streak*motion),s.size);
      });
    });
    g.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  window.addEventListener("resize",resize);
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){running=false}
    else if(!running){running=true;last=performance.now();requestAnimationFrame(frame)}
  });
  resize();
  requestAnimationFrame(frame);
})();

const evCmp=(a,b)=>{
  if(a.date!==b.date)return a.date<b.date?-1:1;
  const x=a.time||"";
  const y=b.time||"";
  if(x!==y)return x<y?-1:1;
  return 0;
};

function eventDates(e,start,end){
  const r=cleanRep(e.rep);
  if(!r)return e.date>=start&&e.date<=end?[e.date]:[];
  const out=[];
  let d=e.date;
  if(r.type==="days"&&start>d){
    const diff=Math.round((parseYmd(start)-parseYmd(d))/86400000);
    d=addDaysYmd(d,Math.floor(diff/r.n)*r.n);
  }
  for(let i=0;i<20000&&d<=end;i++){
    if(d>=start)out.push(d);
    d=nextOccurrence(r,d);
  }
  return out;
}

function eventsByDate(start,end){
  const map={};
  Data.events.forEach(e=>{
    if(!validDate(e.date))return;
    eventDates(e,start,end).forEach(d=>{(map[d]=map[d]||[]).push(e)});
  });
  return map;
}

function eventOccurrences(start,end){
  const out=[];
  Data.events.forEach(e=>{
    if(!validDate(e.date))return;
    eventDates(e,start,end).forEach(d=>out.push(Object.assign({},e,{date:d})));
  });
  return out.sort(evCmp);
}

function upcomingEvents(limit){
  const n=new Date();
  const start=ymd(n);
  const end=ymd(new Date(n.getFullYear(),n.getMonth(),n.getDate()+30));
  return eventOccurrences(start,end).slice(0,limit);
}

const WDN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const WDL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const ORD=["","1st","2nd","3rd","4th","5th"];

function cleanRep(r){
  if(!r||typeof r!=="object")return null;
  const type=["days","weeks","months","years"].indexOf(r.type)>=0?r.type:"";
  if(!type)return null;
  const n=Math.max(1,Math.min(99,Math.floor(Number(r.n))||1));
  const out={type:type,n:n};
  if(type==="weeks"){
    const wd=[];
    (Array.isArray(r.wd)?r.wd:[]).forEach(x=>{
      const v=Math.floor(Number(x));
      if(v>=0&&v<=6&&wd.indexOf(v)<0)wd.push(v);
    });
    out.wd=wd.sort((a,b)=>a-b);
  }
  if(type==="months"){
    out.mode=["day","nth","last"].indexOf(r.mode)>=0?r.mode:"day";
    const dom=Math.floor(Number(r.dom));
    const nth=Math.floor(Number(r.nth));
    if(dom>=1&&dom<=31)out.dom=dom;
    if(nth>=1&&nth<=5)out.nth=nth;
  }
  return out;
}

function repText(r){
  if(!r)return "";
  const unit={days:"day",weeks:"week",months:"month",years:"year"}[r.type];
  let t=r.n===1?"Every "+unit:"Every "+r.n+" "+unit+"s";
  if(r.type==="weeks"&&r.wd&&r.wd.length)t+=" on "+r.wd.map(d=>WDN[d]).join(", ");
  if(r.type==="months"){
    if(r.mode==="nth")t+=" (same weekday)";
    else if(r.mode==="last")t+=" (last weekday)";
  }
  return t;
}

function addDaysYmd(s,k){
  const d=parseYmd(s);
  d.setDate(d.getDate()+k);
  return ymd(d);
}

function daysInMonth(y,m){
  return new Date(y,m+1,0).getDate();
}

function nextOccurrence(r,base){
  const b=parseYmd(base);
  if(r.type==="days")return addDaysYmd(base,r.n);
  if(r.type==="weeks"){
    if(!r.wd||!r.wd.length)return addDaysYmd(base,7*r.n);
    const ws=new Date(b.getFullYear(),b.getMonth(),b.getDate()-b.getDay());
    for(let i=1;i<=7*r.n+7;i++){
      const d=new Date(b.getFullYear(),b.getMonth(),b.getDate()+i);
      const dws=new Date(d.getFullYear(),d.getMonth(),d.getDate()-d.getDay());
      const weeks=Math.round((dws-ws)/604800000);
      if(r.wd.indexOf(d.getDay())>=0&&weeks%r.n===0)return ymd(d);
    }
    return addDaysYmd(base,7*r.n);
  }
  if(r.type==="months"){
    const total=b.getFullYear()*12+b.getMonth()+r.n;
    const y=Math.floor(total/12);
    const m=total%12;
    const dim=daysInMonth(y,m);
    if(r.mode==="day")return ymd(new Date(y,m,Math.min(r.dom||b.getDate(),dim)));
    const wd=b.getDay();
    if(r.mode==="last"){
      const lastWd=new Date(y,m,dim).getDay();
      return ymd(new Date(y,m,dim-((lastWd-wd+7)%7)));
    }
    const nth=r.nth||Math.ceil(b.getDate()/7);
    const firstWd=new Date(y,m,1).getDay();
    let day=1+((wd-firstWd+7)%7)+(nth-1)*7;
    while(day>dim)day-=7;
    return ymd(new Date(y,m,day));
  }
  const y=b.getFullYear()+r.n;
  return ymd(new Date(y,b.getMonth(),Math.min(b.getDate(),daysInMonth(y,b.getMonth()))));
}

function nextDueFor(t){
  const r=cleanRep(t.rep);
  if(!r)return "";
  const today=todayStr();
  let d=validDate(t.due)?t.due:today;
  for(let i=0;i<2000;i++){
    d=nextOccurrence(r,d);
    if(d>=today)break;
  }
  return d;
}

function setTaskDone(t,done){
  t.done=done;
  if(done)t.paused=false;
  const am=t.asset&&MAINT_KEYS.indexOf(t.maint)>=0;
  if(am)assetDone(t,done);
  if(done){

      const mt=maintDef(t.maint);
      const nt={id:uid(),text:t.text,done:false,paused:false,priority:t.priority,due:am&&mt?addMonthsYmd(todayStr(),mt.mo):nextDueFor(t),created:Date.now(),
        tags:(t.tags||[]).slice(),people:(t.people||[]).slice(),project:t.project||"",rep:cleanRep(t.rep)};
      if(am){nt.asset=t.asset;nt.maint=t.maint;nt.prev=""}
      Data.todos.push(nt);
      t.spawned=nt.id;
    }
    if(am&&t.maint!=="loan"&&$("app").classList.contains("live"))setTimeout(()=>openPopup("maintdone",t.id),0);
  }else if(t.spawned){
    const k=Data.todos.findIndex(x=>x.id===t.spawned);
    if(k>=0&&!Data.todos[k].done)Data.todos.splice(k,1);

  }
}

const MAINT=[
  {k:"oil",label:"Oil change",mo:6,ask:"Last oil change"},
  {k:"wipers",label:"Replace wipers",mo:12,ask:"Last replaced window wipers"},
  {k:"air",label:"Replace air filter",mo:12,ask:"Last replaced air filter"},
  {k:"tires",label:"Replace tires",mo:60,ask:"Last replaced tires"},
  {k:"brake",label:"Check brake fluid",mo:24,ask:"Last checked brake fluid"},
  {k:"cool",label:"Check antifreeze",mo:24,ask:"Last checked antifreeze"},
  {k:"reg",label:"Pay registration",mo:12,ask:"Last paid registration"}
];
const HOME_MAINT=[
  {k:"ptax",label:"Pay property tax",mo:12,ask:"Last paid property tax"},
  {k:"ins",label:"Renew home insurance",mo:12,ask:"Last renewed home insurance"}
];
const MAINT_KEYS=MAINT.map(m=>m.k).concat(HOME_MAINT.map(m=>m.k),["loan"]);
const HOME_FIELDS=["name","address","bought","price","value","ptax","ins","loan","pay","payDay","rate"];
const maintDef=k=>MAINT.concat(HOME_MAINT).find(x=>x.k===k);
const VEH_FIELDS=["name","year","bought","price","value","miles","oil","wipers","air","tires","brake","cool","reg","loan","pay","payDay","rate"];

function addMonthsYmd(sv,n){
  const b=parseYmd(sv);
  const total=b.getFullYear()*12+b.getMonth()+n;
  const y=Math.floor(total/12);
  const m=total-y*12;
  return ymd(new Date(y,m,Math.min(b.getDate(),daysInMonth(y,m))));
}

function numIn(v,max,dec){
  const x=parseFloat(String(v==null?"":v).replace(/[$,\s]/g,""));
  if(!isFinite(x)||x<0)return "";
  const r=dec?Math.round(Math.min(x,max)*100)/100:Math.round(Math.min(x,max));
  return r;
}

function cleanAsset(a){
  const home=a.type==="home";
  const o={id:a.id,type:home?"home":"vehicle",name:str(a.name,80).trim(),created:num(a.created,Date.now())};
  o.bought=validDate(a.bought)?a.bought:"";
  o.price=numIn(a.price,1e9,true);
  if(home){
    o.address=str(a.address,200).trim();
    o.value=numIn(a.value,1e10,true);
    HOME_MAINT.forEach(m=>{o[m.k]=validDate(a[m.k])?a[m.k]:""});
  }else{
    const yr=numIn(a.year,2100);
    o.year=yr>=1900?yr:"";
    o.value=numIn(a.value,1e9,true);
    o.miles=numIn(a.miles,2e6);
    MAINT.forEach(m=>{o[m.k]=validDate(a[m.k])?a[m.k]:""});
  }
  o.loan=numIn(a.loan,1e9,true);
  o.pay=numIn(a.pay,1e9,true);
  const d=numIn(a.payDay,31);
  o.payDay=d>=1?d:"";
  o.rate=numIn(a.rate,100,true);
  return o;
}

function vehName(a){return (a.type==="home"?"":(a.year?a.year+" ":""))+a.name}
function moneyText(n){const x=Number(n);return "$"+x.toLocaleString(undefined,{minimumFractionDigits:Number.isInteger(x)?0:2,maximumFractionDigits:2})}

function nextPayDate(day){
  const t=todayStr();
  const y=Number(t.slice(0,4));
  const m=Number(t.slice(5,7))-1;
  const mk=(yy,mm)=>ymd(new Date(yy,mm,Math.min(day,daysInMonth(yy,mm))));
  const c=mk(y,m);
  return c>=t?c:mk(m===11?y+1:y,(m+1)%12);
}

function assetTaskSpecs(a){
  const out=[];
  const nm=vehName(a);
  (a.type==="home"?HOME_MAINT:MAINT).forEach(m=>{
    if(a[m.k])out.push({k:m.k,text:m.label+": "+nm,due:addMonthsYmd(a[m.k],m.mo),rep:{type:"months",n:m.mo,mode:"day"},pri:"med"});
  });
  if(a.loan>0&&a.pay>0){
    const day=a.payDay||1;
    out.push({k:"loan",text:(a.type==="home"?"Pay mortgage: ":"Pay loan: ")+nm+" ("+moneyText(a.pay)+")",due:nextPayDate(day),rep:{type:"months",n:1,mode:"day",dom:day},pri:"high"});
  }
  return out;
}

function syncAssetTasks(a){
  const specs=assetTaskSpecs(a);
  MAINT_KEYS.forEach(k=>{
    const sp=specs.find(x=>x.k===k);
    const idx=Data.todos.findIndex(t=>!t.done&&t.asset===a.id&&t.maint===k);
    if(sp){
      if(idx>=0){
        const t=Data.todos[idx];
        t.text=sp.text;
        t.due=sp.due;
        t.rep=sp.rep;
      }else{
        Data.todos.push({id:uid(),text:sp.text,done:false,paused:false,priority:sp.pri,due:sp.due,created:Date.now(),tags:[a.type==="home"?"home":"vehicle"],people:[],project:"",rep:sp.rep,asset:a.id,maint:k,prev:""});
      }
    }else if(idx>=0){
      Data.todos.splice(idx,1);
    }
  });
  Data.save("todos");
}

function assetDone(t,done){
  const a=Data.assets.find(x=>x.id===t.asset);
  if(!a)return;
  if(done){
    if(t.maint==="loan"){
      t.prev=String(a.loan||0);
      const bal=Number(a.loan)||0;
      const interest=bal*(Number(a.rate)||0)/1200;
      const principal=Math.max(0,(Number(a.pay)||0)-interest);
      a.loan=Math.max(0,Math.round((bal-principal)*100)/100);
    }else{
      t.prev=a[t.maint]||"";
      a[t.maint]=todayStr();
    }
  }else if(t.prev!==undefined&&t.prev!==null){
    if(t.maint==="loan")a.loan=numIn(t.prev,1e9,true);
    else a[t.maint]=validDate(t.prev)?t.prev:"";
  }
  Data.save("assets");
  if($("asList"))renderAssets();
  if($("acSum"))renderAccounting();
}

function assetLoanPaid(t){
  if(t.maint!=="loan")return false;
  const a=Data.assets.find(x=>x.id===t.asset);
  return !!a&&!(a.loan>0);
}

function renderProjects(){

      if(!y)return -1;
      return x<y?-1:1;

function buildTodo(){
  $("view-todo").innerHTML=
    '<div class="toolbar subnav" id="projNav"></div>'+
    '<div class="sub" id="taskPane"><div class="panel"><h2>Task List</h2><div class="toolbar" id="todoBar"></div><div class="pgrid" id="todoList"></div></div></div>'+
    '<div class="sub" id="projPane"><div class="panel"><h2>Projects <span id="projCount" style="color:var(--dim);letter-spacing:.1em"></span></h2><div class="pgrid" id="projList"></div></div></div>';

  $("projNav").addEventListener("click",e=>{
    const b=e.target.closest("[data-sub]");
    if(!b)return;
    Sound.play("nav");
    Armed.clear();
    showProjSub(b.dataset.sub);
  });

  $("todoBar").addEventListener("click",e=>{
    const kf=e.target.closest("[data-kindf]");
    if(kf){
      TodoUI.kind=TodoUI.kind===kf.dataset.kindf?"":kf.dataset.kindf;
      Store.set("todoKind",TodoUI.kind);
      Sound.play("click");
      renderTodo();
      return;
    }
    const f=e.target.closest("[data-filter]");
    if(f){
      TodoUI.filter=f.dataset.filter;
      Store.set("todoFilter",TodoUI.filter);
      Sound.play("click");
      renderTodo();
      return;
    }
    if(e.target.closest("[data-pclear]")){
      TodoUI.project="";
      Sound.play("click");
      renderTodo();
      return;
    }
    if(e.target.closest("[data-act='clear']")){
      if(Armed.hit("t:clear",renderTodo)){
        Data.todos=Data.todos.filter(x=>!x.done);
        Data.save("todos");
        Sound.play("remove");
        refreshProjectsView();
      }else{
        Sound.play("click");
      }
    }
  });

  $("todoList").addEventListener("click",e=>{
    const b=e.target.closest("[data-act]");
    if(!b)return;
    const row=b.closest("[data-id]");
    if(!row)return;
    const id=row.dataset.id;
    const t=Data.todos.find(x=>x.id===id);
    if(!t)return;
    const act=b.dataset.act;
    if(act==="toggle"){
      setTaskDone(t,!t.done);
      Data.save("todos");
      Sound.play(t.done?"complete":"click");
      refreshProjectsView();
    }else if(act==="pause"){
      t.paused=!t.paused;
      Data.save("todos");
      Sound.play(t.paused?"close":"open");
      refreshProjectsView();
    }else if(act==="edit"){
      Armed.clear();
      Sound.play("click");
      openPopup("taskedit",id);
    }else if(act==="del"){
      if(Armed.hit("t:"+id,renderTodo)){
        Data.todos=Data.todos.filter(x=>x.id!==id);
        Data.save("todos");
        Sound.play("remove");
        refreshProjectsView();
      }else{
        Sound.play("click");
      }
    }
  });

  $("projList").addEventListener("click",e=>{
    const b=e.target.closest("[data-act]");
    const card=b&&b.closest("[data-pid]");
    if(!card)return;
    const id=card.dataset.pid;
    const act=b.dataset.act;
    if(act==="tasks"){
      TodoUI.project=id;
      TodoUI.filter="all";
      Sound.play("nav");
      showProjSub("tasks");
      renderTodo();
    }else if(act==="addtask"){
      Sound.play("click");
      openPopup("task","",id);
    }else if(act==="edit"){
      Armed.clear();
      Sound.play("click");
      openPopup("projectedit",id);
    }else if(act==="del"){
      if(Armed.hit("pr:"+id,renderProjects)){
        Data.projects=Data.projects.filter(x=>x.id!==id);
        Data.todos.forEach(t=>{if(t.project===id)t.project=""});
        Data.save("projects");
        Data.save("todos");
        Sound.play("remove");
        refreshProjectsView();
      }else{
        Sound.play("click");
      }
    }
  });

  refreshProjectsView();
  showProjSub(TodoUI.sub);
}

    html+='<button type="button" class="'+cls+'" data-date="'+s+'" aria-label="'+esc(label)+'"><span class="n">'+d.getDate()+'</span><span class="dots">'+dots+"</span></button>";

function wrData(){
  const today=todayStr();
  const days=[];
  const n=new Date();
  for(let i=0;i<7;i++)days.push(ymd(new Date(n.getFullYear(),n.getMonth(),n.getDate()+i)));
  const ev=eventsByDate(days[0],days[6]);
  const active=Data.todos.filter(t=>taskStatus(t)==="active");
  const over=todoSorted(active.filter(t=>t.due&&validDate(t.due)&&t.due<today));
  const rows=days.map(s=>{
    const items=[];
    (ev[s]||[]).slice().sort(evCmp).forEach(e=>items.push({k:"e",time:e.time?fmtTime(e.time):"All day",tx:e.title,tag:e.kind,loc:e.loc||""}));
    todoSorted(active.filter(t=>t.due===s)).forEach(t=>items.push({k:"t",time:"Due",tx:t.text,pri:["high","med","low"].indexOf(t.priority)>=0?t.priority:"med"}));
    bdayList(s).forEach(p=>items.push({k:"b",time:"Birthday",tx:bdayText(p,s).replace(/ birthday/,"")}));
    holidaysOn(s).forEach(h=>items.push({k:"h",time:"Holiday",tx:h.name}));
    return {s:s,items:items};
  });
  return {today:today,days:days,rows:rows,over:over};
}

    }).join("");

const isLeap=y=>(y%4===0&&y%100!==0)||y%400===0;
const bdayMd=b=>String(b).slice(-5);
const bdayYear=b=>/^\d{4}-/.test(String(b))?Number(String(b).slice(0,4)):0;
function bdayOk(b){
  const t=String(b||"");
  if(validDate(t))return true;
  const m=/^--(\d\d)-(\d\d)$/.exec(t);
  if(!m)return false;
  const mo=Number(m[1]);
  const d=Number(m[2]);
  return mo>=1&&mo<=12&&d>=1&&d<=[31,29,31,30,31,30,31,31,30,31,30,31][mo-1];
}
function bdayAge(b){
  const y=bdayYear(b);
  if(!y||!bdayOk(b))return null;
  const n=new Date();
  let a=n.getFullYear()-y;
  const key=bdayKey(b,n.getFullYear());
  const cur=holPad(n.getMonth()+1)+"-"+holPad(n.getDate());
  if(cur<key)a--;
  return a>=0&&a<=150?a:null;
}
function bdayInputHtml(id){
  const mo='<option value="">Month</option>'+MON3.map((m,i)=>'<option value="'+holPad(i+1)+'">'+m+"</option>").join("");
  let dy='<option value="">Day</option>';
  for(let i=1;i<=31;i++)dy+='<option value="'+holPad(i)+'">'+i+"</option>";
  return '<div class="bdayin" id="'+id+'" role="group" aria-label="Birthday"><select data-b="m" aria-label="Birthday month">'+mo+'</select><select data-b="d" aria-label="Birthday day">'+dy+'</select><input type="text" data-b="y" inputmode="numeric" maxlength="4" placeholder="Year (if known)" aria-label="Birthday year" autocomplete="off"></div>';
}
function getBday(id){
  const box=$(id);
  if(!box)return "";
  const m=box.querySelector('[data-b="m"]').value;
  let d=box.querySelector('[data-b="d"]').value;
  const yt=box.querySelector('[data-b="y"]').value.trim();
  if(!m||!d)return "";
  const y=/^\d{4}$/.test(yt)&&Number(yt)>=1900&&Number(yt)<=new Date().getFullYear()?Number(yt):0;
  const max=[31,y?(isLeap(y)?29:28):29,31,30,31,30,31,31,30,31,30,31][Number(m)-1];
  if(Number(d)>max)d=holPad(max);
  return (y?String(y):"-")+"-"+m+"-"+d;
}
function setBday(id,v){
  const box=$(id);
  if(!box)return;
  const ok=bdayOk(v);
  box.querySelector('[data-b="m"]').value=ok?String(v).slice(-5,-3):"";
  box.querySelector('[data-b="d"]').value=ok?String(v).slice(-2):"";
  box.querySelector('[data-b="y"]').value=ok&&bdayYear(v)?String(bdayYear(v)):"";
}
const bdayKey=(b,y)=>{
  const md=bdayMd(b);
  return md==="02-29"&&!isLeap(y)?"02-28":md;
};

const holPad=n=>String(n).padStart(2,"0");
const holYmd=(y,m,d)=>{const t=new Date(Date.UTC(y,m,d));return t.getUTCFullYear()+"-"+holPad(t.getUTCMonth()+1)+"-"+holPad(t.getUTCDate())};
const holShift=(s,k)=>{const p=s.split("-").map(Number);return holYmd(p[0],p[1]-1,p[2]+k)};
const holDow=(y,m,d)=>new Date(Date.UTC(y,m,d)).getUTCDay();
const holNth=(y,m,wd,n)=>holYmd(y,m,1+((wd-holDow(y,m,1)+7)%7)+(n-1)*7);
const holLast=(y,m,wd)=>{const dim=new Date(Date.UTC(y,m+1,0)).getUTCDate();return holYmd(y,m,dim-((holDow(y,m,dim)-wd+7)%7))};
const holRd=rd=>{const t=new Date(Date.UTC(1970,0,1)+(rd-719163)*864e5);return holYmd(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate())};
function holEaster(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return holYmd(y,mo-1,da);
}
function holOrthodox(y){
  const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7;

}

function hebElapsed(y){
  const m=Math.floor((235*y-234)/19);
  const p=12084+13753*m;
  let d=29*m+Math.floor(p/25920);
  if((3*(d+1))%7<3)d++;

}

  const a=hebElapsed(y-1),b=hebElapsed(y),c=hebElapsed(y+1);
  const delay=c-b===356?2:(b-a===382?1:0);
  return -1373427+b+delay;
}

const HOL_RAD=Math.PI/180;

  const Mp=(201.5643+385.81693528*k+0.0107582*T*T+0.00001238*T*T*T-0.000000058*T*T*T*T)*HOL_RAD;
  const F=(160.7108+390.67050284*k-0.0016118*T*T-0.00000227*T*T*T+0.000000011*T*T*T*T)*HOL_RAD;
  const O=(124.7746-1.56375588*k+0.0020672*T*T+0.00000215*T*T*T)*HOL_RAD;
  const full=Math.abs(k-Math.round(k))>0.25;
  const s=Math.sin;
  let c;
  if(!full){
    c=-0.4072*s(Mp)+0.17241*E*s(M)+0.01608*s(2*Mp)+0.01039*s(2*F)+0.00739*E*s(Mp-M)-0.00514*E*s(Mp+M)+0.00208*E*E*s(2*M)-0.00111*s(Mp-2*F)-0.00057*s(Mp+2*F)+0.00056*E*s(2*Mp+M)-0.00042*s(3*Mp)+0.00042*E*s(M+2*F)+0.00038*E*s(M-2*F)-0.00024*E*s(2*Mp-M)-0.00017*s(O)-0.00007*s(Mp+2*M)+0.00004*s(2*Mp-2*F)+0.00004*s(3*M)+0.00003*s(Mp+M-2*F)+0.00003*s(2*Mp+2*F)-0.00003*s(Mp+M+2*F)+0.00003*s(Mp-M+2*F)-0.00002*s(Mp-M-2*F)-0.00002*s(3*Mp+M)+0.00002*s(4*Mp);
  }else{
    c=-0.40614*s(Mp)+0.17302*E*s(M)+0.01614*s(2*Mp)+0.01043*s(2*F)+0.00734*E*s(Mp-M)-0.00515*E*s(Mp+M)+0.00209*E*E*s(2*M)-0.00111*s(Mp-2*F)-0.00057*s(Mp+2*F)+0.00056*E*s(2*Mp+M)-0.00042*s(3*Mp)+0.00042*E*s(M+2*F)+0.00038*E*s(M-2*F)-0.00024*E*s(2*Mp-M)-0.00017*s(O)-0.00007*s(Mp+2*M)+0.00004*s(2*Mp-2*F)+0.00004*s(3*M)+0.00003*s(Mp+M-2*F)+0.00003*s(2*Mp+2*F)-0.00003*s(Mp+M+2*F)+0.00003*s(Mp-M+2*F)-0.00002*s(Mp-M-2*F)-0.00002*s(3*Mp+M)+0.00002*s(4*Mp);
  }

function shiftedParts(ms,hours){
  const t=new Date(ms+hours*36e5);
  return {date:holYmd(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate()),min:t.getUTCHours()*60+t.getUTCMinutes()};
}
function moonIn(y,half,hours,from,to){
  const k0=Math.floor((y-2000)*12.3685);
  for(let k=k0-2;k<=k0+16;k++){
    const p=shiftedParts(moonPhaseMs(k+half),hours);
    if(p.date>=y+"-"+from&&p.date<=y+"-"+to)return p;
  }
  return null;
}
function holIslamic(y,m,d){
  const base=Math.floor((y-622)*33/32);
  for(let h=base-1;h<=base+2;h++){
    const t=holRd(holIslamicRd(h,m,1));
    const ty=Date.UTC(+t.slice(0,4),+t.slice(5,7)-1,+t.slice(8,10));
    const k0=Math.round((ty-Date.UTC(2000,0,6,18,14))/864e5/29.530588861);
    let best="";
    for(let k=k0-2;k<=k0+2;k++){
      const ms=moonPhaseMs(k);
      const u=new Date(ms);
      const conj=Date.UTC(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate());
      const start=conj+864e5*(u.getUTCHours()>=14?2:1);
      if(Math.abs(start-ty)<=2*864e5){
        const dt=new Date(start+(d-1)*864e5);
        best=holYmd(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate());
        break;
      }
    }
    if(best.slice(0,4)===String(y))return best;
  }
  return "";
}

    const o={};
    if(v&&typeof v==="object"&&!Array.isArray(v))HOLIDAY_DEFS.forEach(d=>{if(v[d.id]===true)o[d.id]=true});
    return o;
  })(),

function holidayYear(y){
  if(Hol.cache[y])return Hol.cache[y];
  const map={};
  HOLIDAY_DEFS.forEach(d=>{
    let s="";
    try{s=d.fn(y)}catch(e){s=""}
    if(s&&s.slice(0,4)===String(y))(map[s]=map[s]||[]).push({id:d.id,name:d.name,group:d.group});
  });
  Hol.cache[y]=map;
  return map;
}

function holidaysOn(s){

function bdayList(s){
  const y=Number(s.slice(0,4));
  const md=s.slice(5);
  return Data.people.filter(p=>p.birthday&&bdayOk(p.birthday)&&bdayKey(p.birthday,y)===md);
}

function bdayText(p,s){
  const age=bdayYear(p.birthday)?Number(s.slice(0,4))-bdayYear(p.birthday):0;
  return p.name+" birthday"+(age>0?" (turns "+age+")":"");
}

function daysToBday(b){
  if(!b||!bdayOk(b))return null;
  const n=new Date();
  const t=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  for(let k=0;k<2;k++){
    const y=t.getFullYear()+k;
    const key=bdayKey(b,y);
    const d=new Date(y,Number(key.slice(0,2))-1,Number(key.slice(3)));
    if(d>=t)return Math.round((d-t)/86400000);
  }
  return null;
}

function bdayLabel(b){
  const n=daysToBday(b);
  if(n===null)return "";
  const md=bdayMd(b);
  const base=MON3[Number(md.slice(0,2))-1]+" "+Number(md.slice(3));
  if(n===0)return base+" (today)";
  if(n===1)return base+" (tomorrow)";
  return base+" (in "+n+" days)";
}

function upcomingItems(limit){
  const items=upcomingEvents(500).filter(evKeep).map(e=>({date:e.date,time:e.time||"",title:e.title,kind:"e",tag:e.kind,loc:e.loc||""}));

function parseTags(str){
  const out=[];
  String(str).split(",").forEach(x=>{
    const t=x.trim().replace(/^#+/,"").toLowerCase().slice(0,24);
    if(t&&out.indexOf(t)<0&&out.length<10)out.push(t);
  });
  return out;
}

function matchText(q,parts){
  if(!q)return true;
  const hay=parts.join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.indexOf(w)>=0);
}

function fmtStamp(ms){

function safeFileName(t){
  const n=String(t||"note").replace(/[\\/:*?"<>|\x00-\x1f]+/g," ").replace(/\s+/g," ").trim().slice(0,60);
  return n||"note";
}

function noteAsText(n){
  const tags=(n.tags||[]).length?"Tags: "+n.tags.join(", ")+"\n":"";
  return (n.title||"Untitled")+"\n"+tags+"\n"+String(n.body||"");
}

function saveTextFile(name,text){
  try{
    const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    return true;
  }catch(e){
    return false;
  }
}

function exportNote(n){
  if(saveTextFile(safeFileName(n.title)+".txt",noteAsText(n))){
    Sound.play("confirm");
    noteMsg("Exported "+(n.title||"Untitled")+".txt","ok");
  }else{
    Sound.play("error");
    noteMsg("Download is not available here. Use Copy instead.","err");
  }
}

}

async function zipEntryText(buf,wanted){
  const dv=new DataView(buf);
  const u8=new Uint8Array(buf);
  let end=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65600);i--){
    if(dv.getUint32(i,true)===0x06054b50){end=i;break}
  }
  if(end<0)throw new Error("Not a valid Word file.");
  const count=dv.getUint16(end+10,true);
  let p=dv.getUint32(end+16,true);
  for(let k=0;k<count;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true);
    const csize=dv.getUint32(p+20,true);
    const nlen=dv.getUint16(p+28,true);
    const xlen=dv.getUint16(p+30,true);
    const clen=dv.getUint16(p+32,true);
    const off=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nlen));
    if(name===wanted){
      const ln=dv.getUint16(off+26,true);
      const lx=dv.getUint16(off+28,true);
      const start=off+30+ln+lx;
      const data=u8.subarray(start,start+csize);
      if(method===0)return new TextDecoder().decode(data);
      if(method!==8||typeof DecompressionStream==="undefined")throw new Error("This browser cannot open Word files.");
      const stream=new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return new TextDecoder().decode(await new Response(stream).arrayBuffer());
    }
    p+=46+nlen+xlen+clen;
  }
  throw new Error("No document text found in this Word file.");
}

async function docxToText(file){
  const xml=await zipEntryText(await file.arrayBuffer(),"word/document.xml");
  const doc=new DOMParser().parseFromString(xml,"application/xml");
  const W="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  const out=[];
  const walk=el=>{
    for(const c of el.childNodes){
      if(c.nodeType!==1)continue;
      const ln=c.localName;
      if(ln==="t")out.push(c.textContent);
      else if(ln==="tab")out.push("\t");
      else if(ln==="br"||ln==="cr")out.push("\n");
      else if(ln==="p"){walk(c);out.push("\n")}
      else if(ln==="tc"){walk(c);out.push("\t")}
      else walk(c);
    }
  };
  const body=doc.getElementsByTagNameNS(W,"body")[0]||doc.documentElement;
  walk(body);
  return out.join("").replace(/\t+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
}

function loadScriptOnce(src){
  return new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=src;
    s.onload=res;
    s.onerror=()=>rej(new Error("Could not load the PDF reader. PDF import needs an internet connection."));
    document.head.appendChild(s);
  });
}

async function pdfToText(file){
  const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  if(!window.pdfjsLib)await loadScriptOnce(base+"pdf.min.js");
  if(!window.pdfjsLib)throw new Error("Could not load the PDF reader.");
  if(!pdfjsLib.GlobalWorkerOptions.workerSrc){
    const w=await fetch(base+"pdf.worker.min.js").then(r=>r.text());
    pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:"text/javascript"}));
  }
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const pages=[];
  for(let i=1;i<=pdf.numPages;i++){
    const pg=await pdf.getPage(i);
    const tc=await pg.getTextContent();
    let line="";
    const lines=[];
    tc.items.forEach(it=>{
      line+=it.str;
      if(it.hasEOL){lines.push(line);line=""}
      else if(it.str&&!/\s$/.test(it.str))line+=" ";
    });
    if(line.trim())lines.push(line);
    pages.push(lines.join("\n"));
  }
  return pages.join("\n\n").replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
}

async function importNoteFile(file){
  const name=file.name||"Imported note";
  const ext=(name.split(".").pop()||"").toLowerCase();
  const title=name.replace(/\.[^.]+$/,"").slice(0,120)||"Imported note";
  if(["txt","md","docx","pdf"].indexOf(ext)<0){
    Sound.play("error");
    noteMsg("That file type is not supported. Choose a .txt, .md, .docx or .pdf file.","err");
    return;
  }
  if(file.size>15*1024*1024){
    Sound.play("error");
    noteMsg("That file is too large. The limit is 15 MB.","err");
    return;
  }
  noteMsg("Reading "+name+"...","info");
  try{
    let text;
    if(ext==="docx")text=await docxToText(file);
    else if(ext==="pdf")text=await pdfToText(file);
    else text=await file.text();
    text=String(text).replace(/\r\n?/g,"\n").replace(/\u0000/g,"").trim();
    if(!text){
      Sound.play("error");
      noteMsg("No text was found in "+name+". Scanned pictures of text cannot be read.","err");
      return;
    }
    let cut=false;
    if(text.length>20000){text=text.slice(0,20000);cut=true}
    const n={id:uid(),title:title,body:text,tags:["imported"],created:Date.now(),updated:Date.now(),archived:false};
    Data.notes.push(n);
    Data.save("notes");
    Sound.play("confirm");
    renderNoteList();
    noteMsg("Imported "+name+" as a plain text note."+(cut?" It was longer than 20,000 characters, so the end was cut off.":""),cut?"info":"ok");
  }catch(e){
    Sound.play("error");
    noteMsg(e&&e.message?e.message:"Could not read that file.","err");
  }
}

function personSorted(list){
  const key=p=>[p.last||p.first||"",p.first||"",p.middle||""];
  const byName=(a,b)=>{
    const x=key(a);
    const y=key(b);
    for(let i=0;i<3;i++){
      const c=String(x[i]).localeCompare(String(y[i]),undefined,{sensitivity:"base"});
      if(c)return c;
    }
    return 0;
  };
  const arr=list.slice();
  if(PersonUI.sort==="birthday"){
    return (arr.sort((a,b)=>{
      const x=daysToBday(a.birthday);
      const y=daysToBday(b.birthday);
      if(x===null&&y===null)return byName(a,b);
      if(x===null)return 1;
      if(y===null)return -1;
      return x-y||byName(a,b);
    }));
  }
  return (arr.sort(byName));
}

const PicCache=(()=>{
  const v=Store.get("thumbCache",{});
  const o={};
  if(v&&typeof v==="object"&&!Array.isArray(v))Object.keys(v).slice(-300).forEach(k=>{
    const u=v[k];
    if(u===""||(typeof u==="string"&&u.indexOf("https://upload.wikimedia.org/")===0))o[k]=u;
  });
  return o;
})();
const PicBusy={};
const PicIcons={};
const PIC_HINT={Games:"video game",Books:"book",Video:"film or television series"};

function savePicCache(){
  const k=Object.keys(PicCache);
  if(k.length>300)k.slice(0,k.length-300).forEach(x=>{delete PicCache[x]});
  Store.set("thumbCache",PicCache);
}

function pixelIcon(title){
  const key=String(title||"").trim().toLowerCase()+"|"+Theme.cyanRgb+"|"+Theme.blueRgb;
  if(PicIcons[key])return PicIcons[key];
  let h=2166136261;
  for(let i=0;i<key.length;i++){h^=key.charCodeAt(i);h=Math.imul(h,16777619)>>>0}
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296};
  const c=document.createElement("canvas");
  c.width=9;
  c.height=9;
  const g=c.getContext("2d");
  g.fillStyle="#020a18";
  g.fillRect(0,0,9,9);
  const pal=["rgb("+Theme.cyanRgb+")","rgb("+Theme.blueRgb+")","rgb(230,245,255)"];
  for(let y=0;y<7;y++){
    for(let x=0;x<4;x++){
      if(rnd()<(x===3?.62:.48)){
        const r=rnd();
        g.fillStyle=r<.12?pal[2]:r<.55?pal[0]:pal[1];
        g.fillRect(1+x,1+y,1,1);
        g.fillRect(7-x,1+y,1,1);
      }
    }
  }
  PicIcons[key]=c.toDataURL("image/png");
  return PicIcons[key];
}

function picQuery(title,slotId){

function titleRow(title,slotId){

  if(Prefs.pics==="off")return t;
  const px=pixelIcon(title);

    const q=picQuery(title,slotId);
    const c=PicCache[q.toLowerCase()];
    if(c)return '<div class="tr"><img class="pic wk" alt="" src="'+esc(c)+'" data-px="'+px+'">'+t+"</div>";
    if(c===undefined)return '<div class="tr"><img class="pic" alt="" src="'+px+'" data-px="'+px+'" data-wt="'+esc(q)+'">'+t+"</div>";
  }
  return '<div class="tr"><img class="pic" alt="" src="'+px+'">'+t+"</div>";
}

function fetchThumb(q){
  const key=q.toLowerCase();
  if(PicBusy[key])return PicBusy[key];
  const url="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=1&gsrnamespace=0&prop=pageimages&piprop=thumbnail&pithumbsize=160&gsrsearch="+encodeURIComponent(q);
  const ctl=typeof AbortController==="function"?new AbortController():null;
  const timer=setTimeout(()=>{if(ctl)ctl.abort()},8000);
  PicBusy[key]=fetch(url,ctl?{signal:ctl.signal}:{}).then(r=>{
    if(!r.ok)throw new Error("http");
    return r.json();
  }).then(j=>{
    let u="";
    const pages=j&&j.query&&j.query.pages?Object.keys(j.query.pages).map(k=>j.query.pages[k]):[];
    if(pages[0]&&pages[0].thumbnail&&typeof pages[0].thumbnail.source==="string"&&pages[0].thumbnail.source.indexOf("https://upload.wikimedia.org/")===0)u=pages[0].thumbnail.source;
    PicCache[key]=u;
    savePicCache();
    return u;
  }).catch(()=>null).then(u=>{
    clearTimeout(timer);
    delete PicBusy[key];
    return u;
  });
  return PicBusy[key];
}

function hydratePics(){
  if(Prefs.pics!=="wiki")return;
  const seen={};
  document.querySelectorAll("img.pic[data-wt]").forEach(img=>{
    const q=img.dataset.wt;
    const k=q.toLowerCase();
    if(PicCache[k]!==undefined||seen[k])return;
    seen[k]=true;
    fetchThumb(q).then(u=>{
      if(!u)return;
      document.querySelectorAll("img.pic[data-wt]").forEach(m=>{
        if(m.dataset.wt.toLowerCase()===k){
          m.classList.add("wk");
          m.src=u;
          m.removeAttribute("data-wt");
        }
      });
    });
  });
}

function buildPlaying(){
  const root=$("view-playing");
  root.addEventListener("click",e=>{
    const b=e.target.closest("[data-act]");
    if(!b)return;
    const card=b.closest("[data-slot]");
    if(!card)return;
    const id=card.dataset.slot;
    const act=b.dataset.act;
    const p=Data.playing[id];
    if(act==="edit"){
      PlayUI.editing=id;
      Armed.clear();
      Sound.play("click");
      renderPlaying();
      const el=root.querySelector(".f-title");
      if(el)el.focus();
    }else if(act==="cancel"){
      PlayUI.editing=null;
      Sound.play("click");
      renderPlaying();
    }else if(act==="save"){
      savePlaySlot(card);
    }else if(act==="complete"&&p){
      const title=p.title;
      completeSlot(id);
      PlayUI.msg=title+" moved to Completed.";
      Sound.play("complete");
      renderPlaying();
      renderCompleted();
    }else if(act==="shelve"&&p){
      const title=p.title;
      shelveSlot(id);
      PlayUI.msg=title+" moved to Shelved.";
      Sound.play("close");
      renderPlaying();
      renderShelved();
    }else if(act==="clear"){
      if(Armed.hit("pl:"+id,renderPlaying)){
        delete Data.playing[id];
        Data.save("playing");
        Sound.play("remove");
        renderPlaying();
      }else{
        Sound.play("click");
      }
    }
  });
  root.addEventListener("input",e=>{
    if(e.target.classList.contains("f-prog")){
      const out=e.target.parentNode.querySelector("output");
      if(out)out.textContent=e.target.value+"%";
    }
  });
  root.addEventListener("keydown",e=>{
    const card=e.target.closest(".slot");
    if(!card||PlayUI.editing!==card.dataset.slot)return;
    if(e.key==="Enter"&&e.target.tagName==="INPUT"&&e.target.type==="text"){
      e.preventDefault();
      savePlaySlot(card);
    }else if(e.key==="Escape"){
      PlayUI.editing=null;
      renderPlaying();
    }
  });
  renderPlaying();
}

function validateImport(raw){

  if(!obj||typeof obj!=="object"||obj.app!=="ianverse"||!obj.data||typeof obj.data!=="object")return {ok:false,error:"This does not look like an IntelDeck backup."};
  const d=obj.data;
  const skipped={n:0};
  const arr=v=>Array.isArray(v)?v.filter(x=>{
    if(x&&typeof x==="object"&&!Array.isArray(x))return true;
    skipped.n++;
    return false;
  }):[];
  const todos=uniqueIds(arr(d.todos).map(t=>({
    id:t.id,text:str(t.text,200),done:!!t.done,paused:!!t.paused&&!t.done,
    tags:cleanTagList(t.tags,10),people:(Array.isArray(t.people)?t.people:[]).map(x=>String(x)).slice(0,20),project:str(t.project,40),
    priority:["high","med","low"].indexOf(t.priority)>=0?t.priority:"med",
    due:validDate(t.due)?t.due:"",created:num(t.created,Date.now()),
    rep:cleanRep(t.rep),spawned:str(t.spawned,40),
    asset:str(t.asset,40),maint:MAINT_KEYS.indexOf(t.maint)>=0?t.maint:"",prev:str(t.prev,20),kind:TASK_KINDS.some(x=>x[0]===t.kind)?t.kind:""
  })).filter(t=>{
    if(t.text.trim())return true;
    skipped.n++;
    return false;
  }));
  const events=uniqueIds(arr(d.events).map(e=>({
    id:e.id,title:str(e.title,120),date:validDate(e.date)?e.date:"",
    time:/^\d{2}:\d{2}$/.test(String(e.time||""))?e.time:"",notes:str(e.notes,300),loc:str(e.loc,200),rep:cleanRep(e.rep),kind:e.kind==="work"||e.kind==="personal"?e.kind:""
  })).filter(e=>{
    if(e.title.trim()&&e.date)return true;
    skipped.n++;
    return false;
  }));
  const notes=uniqueIds(arr(d.notes).map(n=>({
    id:n.id,title:str(n.title,120),body:str(n.body,20000),
    tags:parseTags(Array.isArray(n.tags)?n.tags.join(","):""),
    created:num(n.created,Date.now()),updated:num(n.updated,num(n.created,Date.now())),archived:!!n.archived,archivedAt:num(n.archivedAt,0)
  })));
  const people=uniqueIds(arr(d.people).map(p=>{
    let first=str(p.first,60).trim();
    let middle=str(p.middle,60).trim();
    let last=str(p.last,60).trim();
    if(!first&&!middle&&!last){
      const n=splitName(str(p.name,100));
      first=n.first;
      middle=n.middle;
      last=n.last;
    }
    return {
      id:p.id,first:first,middle:middle,last:last,name:joinName(first,middle,last),
      relation:str(p.relation,60),phone:str(p.phone,40),email:str(p.email,120),
      birthday:bdayOk(p.birthday)?p.birthday:"",notes:str(p.notes,5000),created:num(p.created,Date.now()),
      job:str(p.job,80),gender:p.gender==="male"||p.gender==="female"?p.gender:"",religion:str(p.religion,60),me:p.me===true,street:str(p.street,200)||(p.city||p.state||p.zip?"":str(p.address,200)),city:str(p.city,60),state:str(p.state,40),zip:str(p.zip,12),tags:cleanTagList(p.tags,20),tagTypes:cleanTagTypes(p.tagTypes,cleanTagList(p.tags,20)),
      rels:(Array.isArray(p.rels)?p.rels:[]).filter(r=>r&&typeof r==="object").slice(0,50).map(r=>({pid:String(r.pid||""),label:str(r.label,40).trim()}))
    };
  }).map((p,i,a)=>{
    if(p.me&&a.findIndex(x=>x.me)!==i)p.me=false;
    if(!p.me)delete p.me;
    return p;
  }).filter(p=>{
    if(p.name.trim())return true;
    skipped.n++;
    return false;
  }));
  people.forEach(p=>{
    p.rels=p.rels.filter(r=>r.pid&&r.pid!==p.id&&people.some(o=>o.id===r.pid));
  });
  const projects=uniqueIds(arr(d.projects).map(p=>({
    id:p.id,name:str(p.name,120),deadline:validDate(p.deadline)?p.deadline:"",notes:str(p.notes,5000),
    people:(Array.isArray(p.people)?p.people:[]).map(x=>String(x)).slice(0,20),created:num(p.created,Date.now())
  })).filter(p=>{
    if(p.name.trim())return true;
    skipped.n++;
    return false;
  }));
  projects.forEach(p=>{p.people=p.people.filter(id=>people.some(o=>o.id===id))});
  todos.forEach(t=>{
    t.people=t.people.filter(id=>people.some(o=>o.id===id));
    if(!projects.some(p=>p.id===t.project))t.project="";
  });
  const playing={};
  const pl=d.playing&&typeof d.playing==="object"&&!Array.isArray(d.playing)?d.playing:{};
  SLOTS.forEach(sl=>{
    const x=pl[sl.id];

    progress:clampPct(e.progress),notes:str(e.notes,300),shelved:num(e.shelved,Date.now())
  })).filter(e=>{
    if(e.title.trim()&&slotById(e.slot))return true;
    skipped.n++;
    return false;
  }));
  const assets=uniqueIds(arr(d.assets).map(cleanAsset).filter(a=>a.name));
  const invest=uniqueIds(arr(d.invest).map(cleanInvest).filter(r=>r.name));
  const tobuy=uniqueIds(arr(d.tobuy).map(cleanBuy).filter(x=>x.name));

  })).filter(e=>{
    if(e.title.trim()&&slotById(e.slot))return true;
    skipped.n++;
    return false;
  }));
  const s=d.settings&&typeof d.settings==="object"?d.settings:{};
  const settings={
    muted:!!s.muted,
    volume:Math.max(0,Math.min(1,num(s.volume,0.6))),
    todoFilter:["all","active","paused","done"].indexOf(s.todoFilter)>=0?s.todoFilter:"all",
    personSort:["name","birthday"].indexOf(s.personSort)>=0?s.personSort:"name",

    theme:s.theme&&typeof s.theme==="object"?themeFrom(s.theme.id,s.theme.primary):themeFrom("cyan",""),
    holGroups:HOLIDAY_GROUPS.reduce((o,g)=>{if(s.holGroups&&s.holGroups[g[0]]===false)o[g[0]]=false;return o},{}),
    holOff:HOLIDAY_DEFS.reduce((o,d)=>{if(s.holOff&&s.holOff[d.id]===true)o[d.id]=true;return o},{}),
    showExtras:s.showExtras===true,
    pics:PIC_MODES.indexOf(s.pics)>=0?s.pics:"pixel",
    autoTax:s.autoTax!==false,
    taxAdded:s.taxAdded===true,
    bridgeTasks:clampInt(s.bridgeTasks,1,10,3),
    bridgeEvents:clampInt(s.bridgeEvents,1,10,3),
    uiSize:clampStep(s.uiSize,70,150,10,100),
    textSize:clampStep(s.textSize,70,160,10,100),
    uiOpacity:clampStep(s.uiOpacity,30,100,5,100),
    slots:{
      Games:clampInt(s.slots&&s.slots.Games,1,9,3),
      Books:clampInt(s.slots&&s.slots.Books,1,9,3),
      Video:clampInt(s.slots&&s.slots.Video,1,9,3)
    }
  };
  return {ok:true,clean:{todos:todos,projects:projects,events:events,notes:notes,people:people,playing:playing,shelved:shelved,completed:completed,assets:assets,bills:bills,debts:debts,invest:invest,tobuy:tobuy,settings:settings},skipped:skipped.n,exported:typeof obj.exported==="string"?obj.exported:"",from:typeof obj.version==="string"?obj.version:""};
}

function doExport(){
  const text=JSON.stringify(exportPayload(),null,2);
  try{
    const blob=new Blob([text],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=backupFileName();
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    markBackup();
    Sound.play("confirm");
    setMsg("Backup file created. If your browser did not download it, use Copy Backup instead.","ok");
  }catch(e){
    Sound.play("error");
    setMsg("Download is not available here. Use Copy Backup instead.","err");
  }
}

function doCopy(){
  const text=JSON.stringify(exportPayload(),null,2);
  const fallback=()=>{
    const box=$("copyBox");
    box.hidden=false;
    box.value=text;
    box.focus();
    box.select();
    setMsg("Copy was blocked. The backup text is shown below. Select it all, copy it and paste it into a file named backup.json.","info");
    markBackup();
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      markBackup();
      Sound.play("confirm");
      setMsg("Backup copied. Paste it into a text file and save it as backup.json.","ok");
    },fallback);
  }else{
    fallback();
  }
}

function checkImport(){
  const raw=$("impText").value.trim();
  const box=$("impPreview");
  Backup.pending=null;
  Armed.clear();
  if(!raw){
    box.hidden=true;
    Sound.play("error");
    setMsg("Choose a backup file or paste backup text first.","err");
    return;
  }
  const r=validateImport(raw);
  if(!r.ok){
    box.hidden=true;
    Sound.play("error");
    setMsg(r.error,"err");

  Backup.pending=r.clean;

  $("impSummary").textContent="Backup contains: "+summaryText(r.clean)+"."+(r.exported&&!isNaN(Date.parse(r.exported))?" Exported "+fmtStamp(Date.parse(r.exported))+".":"")+(r.skipped?" "+r.skipped+" invalid items will be skipped.":"");

}

const BRAIN_W=31;
const BRAIN_H=24;
let brainCells=null;

function brainShape(){
  if(brainCells)return brainCells;
  const cells=[];
  for(let y=0;y<BRAIN_H;y++){
    for(let x=0;x<BRAIN_W;x++){
      const dx=(x+.5-BRAIN_W/2)/(BRAIN_W/2-1);
      const dy=(y+.5-9.5)/9;
      let inside=dx*dx+dy*dy<=1&&y<=18;
      if(x>=14&&x<=16&&y>=17&&y<=22)inside=true;
      if(inside&&x===15&&y>=1&&y<=10)inside=false;
      if(!inside)continue;
      const h=(((x*73856093)^(y*19349663))>>>0)%1000/1000;
      const d=Math.sqrt(dx*dx+dy*dy);
      cells.push({x:x,y:y,g:((x*7+y*3)%11===0||(x*3+y*5)%13===0)&&y>2&&y<17,r:h*.55+d*.45});
    }
  }
  cells.sort((a,b)=>a.r-b.r);
  brainCells=cells;
  return cells;
}

function drawBrain(f){
  const cv=$("brain");
  if(!cv||!cv.getContext)return;
  const ctx=cv.getContext("2d");
  const cs=Math.floor(cv.width/BRAIN_W);
  ctx.clearRect(0,0,cv.width,cv.height);
  const cells=brainShape();
  const lit=Math.round(f*cells.length);
  cells.forEach((c,i)=>{
    if(i<lit){
      const hue=320-130*(c.y/BRAIN_H);
      ctx.fillStyle="hsl("+hue+",85%,"+(c.g?38:62)+"%)";
    }else{
      ctx.fillStyle="rgba("+Theme.cyanRgb+",.09)";
    }
    ctx.fillRect(c.x*cs,c.y*cs,cs-1,cs-1);
  });
}

function renderIntel(){
  if(!$("brain"))return;
  const intel=intelCount();
  const bytes=Store.bytes();
  const points=intel+bytes/300;
  const f=1-Math.exp(-points/300);
  const names=["Dormant","Waking","Curious","Sharp","Brilliant","Genius","Cosmic"];
  const lvl=Math.min(names.length-1,Math.floor(f*names.length));
  $("intelCount").textContent=String(intel);
  $("intelBytes").textContent=fmtBytes(bytes);
  $("intelBrain").textContent=names[lvl]+" ("+Math.round(f*100)+"%)";
  drawBrain(f);
}

  openModal(p.dataset.title,"");

function shelveSlot(id){
  const p=Data.playing[id];
  if(!p)return;
  Data.shelved.push({id:uid(),slot:id,title:p.title,detail:p.detail||"",progress:clampPct(p.progress),notes:p.notes||"",shelved:Date.now()});
  delete Data.playing[id];
  Data.save("playing");
  Data.save("shelved");
}

function completeSlot(id){
  const p=Data.playing[id];
  if(!p)return;
  Data.completed.push({id:uid(),slot:id,title:p.title,detail:p.detail||"",notes:p.notes||"",completed:Date.now(),wallpaper:false,card:false});
  delete Data.playing[id];
  Data.save("playing");
  Data.save("completed");
}

function migratePlaying(){
  let moved=0;
  Object.keys(Data.playing).forEach(id=>{
    const p=Data.playing[id];
    if(!slotById(id)||!p||typeof p!=="object"||!p.title)return;
    if(p.status==="finished"){
      Data.completed.push({id:uid(),slot:id,title:String(p.title),detail:String(p.detail||""),notes:String(p.notes||""),completed:p.updated||Date.now(),wallpaper:false,card:false});
      delete Data.playing[id];
      moved++;
    }else if(p.status==="dropped"){
      Data.shelved.push({id:uid(),slot:id,title:String(p.title),detail:String(p.detail||""),progress:clampPct(p.progress),notes:String(p.notes||""),shelved:p.updated||Date.now()});
      delete Data.playing[id];
      moved++;
    }
  });
  if(moved){
    Data.save("playing");
    Data.save("shelved");
    Data.save("completed");
  }
  return moved;
}

function returnToPlaying(listKey,eid){
  const list=Data[listKey];
  const e=list.find(x=>x.id===eid);
  if(!e)return {ok:false,text:""};
  const sl=slotById(e.slot);
  if(!sl)return {ok:false,text:"That entry has an unknown slot."};
  const cur=Data.playing[e.slot];
  if(cur&&cur.title){
    return {ok:false,text:"Your "+sl.label+" slot is in use by "+cur.title+". Shelve or complete it first."};
  }
  Data.playing[e.slot]={
    title:e.title,
    detail:e.detail||"",
    status:"active",
    progress:listKey==="shelved"?clampPct(e.progress):0,
    notes:e.notes||"",
    updated:Date.now()
  };
  Data[listKey]=list.filter(x=>x.id!==eid);
  Data.save("playing");
  Data.save(listKey);
  return {ok:true,text:e.title+" is back in your "+sl.label+" slot."};
}

function groupCounts(list){
  const c={all:list.length,Games:0,Books:0,Video:0};
  list.forEach(e=>{
    const sl=slotById(e.slot);
    if(sl)c[sl.group]++;
  });
  return c;
}

function renderShelved(){
  const counts=groupCounts(Data.shelved);
  if(ShelfUI.group!=="all"&&!counts[ShelfUI.group])ShelfUI.group="all";
  $("shelfBar").innerHTML=chipsHtml(SHELF_FILTERS.map(g=>[g,g==="all"?"All":g]),ShelfUI.group,counts);
  const shown=Data.shelved.filter(e=>{
    const sl=slotById(e.slot);
    if(ShelfUI.group!=="all"&&(!sl||sl.group!==ShelfUI.group))return false;
    return matchText(ShelfUI.q,[e.title,e.detail,e.notes,sl?sl.label:""]);
  }).sort((a,b)=>(b.shelved||0)-(a.shelved||0));
  $("shelfList").innerHTML=shown.length?shown.map(shelvedCard).join(""):
    '<p class="empty">'+(Data.shelved.length?"Nothing matches.":"Nothing shelved. Use Shelve on a Playing slot, or add something above, to come back to it later.")+"</p>";
  $("shelfCount").textContent="("+Data.shelved.length+")";
  hydratePics();
}

function renderCompleted(){
  const list=Data.completed;
  const counts=groupCounts(list);
  counts.nowall=list.filter(e=>!e.wallpaper).length;
  counts.nocard=list.filter(e=>!e.card).length;
  const items=[["all","All"],["Games","Games"],["Books","Books"],["Video","Video"]];
  if(Prefs.extras){
    items.push(["nowall","No wallpaper"]);
    items.push(["nocard","No card"]);
  }else if(DoneUI.filter==="nowall"||DoneUI.filter==="nocard"){
    DoneUI.filter="all";
  }
  $("doneBar").innerHTML=chipsHtml(items,DoneUI.filter,counts);
  const shown=list.filter(e=>{
    const sl=slotById(e.slot);
    if(DoneUI.filter==="nowall"&&e.wallpaper)return false;
    if(DoneUI.filter==="nocard"&&e.card)return false;
    if(["Games","Books","Video"].indexOf(DoneUI.filter)>=0&&(!sl||sl.group!==DoneUI.filter))return false;
    return matchText(DoneUI.q,[e.title,e.detail,e.notes,sl?sl.label:""]);
  }).sort((a,b)=>(b.completed||0)-(a.completed||0));
  $("doneList").innerHTML=shown.length?shown.map(completedCard).join(""):
    '<p class="empty">'+(list.length?"Nothing matches.":"Nothing completed yet. Use Complete on a Playing slot, or add something you finished above.")+"</p>";
  const w=list.filter(e=>e.wallpaper).length;
  const c=list.filter(e=>e.card).length;
  $("doneSum").innerHTML="<b>"+list.length+"</b> completed"+(Prefs.extras?" &middot; <b>"+w+"</b> "+(w===1?"wallpaper":"wallpapers")+" made &middot; <b>"+c+"</b> "+(c===1?"card":"cards")+" made":"");
  hydratePics();
}

const clampInt=(v,lo,hi,d)=>{
  const n=Math.round(Number(v));
  return Number.isFinite(n)?Math.max(lo,Math.min(hi,n)):d;
};
const numOpts=(lo,hi,sel)=>{
  let h="";
  for(let i=lo;i<=hi;i++)h+='<option value="'+i+'"'+(i===sel?" selected":"")+">"+i+"</option>";
  return h;
};
function loadSlotCounts(){
  const v=loadObj("slotCounts");
  return {Games:clampInt(v.Games,1,9,3),Books:clampInt(v.Books,1,9,3),Video:clampInt(v.Video,1,9,3)};
}
const clampStep=(v,lo,hi,st,d)=>{
  const n=Number(v);
  if(!isFinite(n))return d;
  return Math.min(hi,Math.max(lo,Math.round(n/st)*st));
};

  bridgeEvents:clampInt(Store.get("bridgeEvents",3),1,10,3),
  slots:loadSlotCounts(),

  textSize:clampStep(Store.get("textSize",100),70,160,10,100),
  uiOpacity:clampStep(Store.get("uiOpacity",100),30,100,5,100),
  scribeOff:(()=>{

function saveEntPopup(done){
  const title=$("nwETitle").value.trim();
  if(!title){
    Sound.play("error");
    $("nwETitle").focus();
    return;
  }
  const slot=$("nwType").value;
  const detail=$("nwDetail").value.trim();
  const notes=$("nwNotes").value.trim();
  if(done){
    const day=validDate($("nwDate").value)?parseYmd($("nwDate").value):new Date();
    day.setHours(12,0,0,0);
    Data.completed.push({id:uid(),slot:slot,title:title,detail:detail,notes:notes,completed:day.getTime(),wallpaper:Prefs.extras&&!!$("nwWall")&&$("nwWall").checked,card:Prefs.extras&&!!$("nwCard")&&$("nwCard").checked});
    Data.save("completed");
    Sound.play("complete");
    setViewMsg(DoneUI,"doneMsg",title+" added to Completed.","ok");
    closeModal(true);
    renderCompleted();
  }else{
    Data.shelved.push({id:uid(),slot:slot,title:title,detail:detail,progress:0,notes:notes,shelved:Date.now()});
    Data.save("shelved");
    Sound.play("confirm");
    setViewMsg(ShelfUI,"shelfMsg",title+" added to Shelved.","ok");
    closeModal(true);
    renderShelved();
  }
  renderEntNav();
}

function ordSuffix(n){
  const v=n%100;
  if(v>=11&&v<=13)return "th";
  return ({1:"st",2:"nd",3:"rd"})[n%10]||"th";
}

const INV_TYPES=[["stock","Stock"],["metal","Precious metal"],["collect","Collectible"],["crypto","Crypto"],["bank","Bank account"],["retire","Retirement account"],["other","Other"]];
const METALS=[["gold","Gold"],["silver","Silver"],["platinum","Platinum"],["palladium","Palladium"]];
const ASSET_CATS=[["vehicle","Vehicles","#3987e5"],["home","Homes","#d95926"],["stock","Stocks","#199e70"],["metal","Precious metals","#c98500"],["collect","Collectibles","#d55181"],["crypto","Crypto","#008300"],["bank","Bank accounts","#9085e9"],["retire","Retirement","#e66767"],["other","Other","#8a94a6"]];

function numP(v,max,dp){
  const x=parseFloat(String(v==null?"":v).replace(/[$,\s]/g,""));
  if(!isFinite(x)||x<0)return "";
  const k=Math.pow(10,dp||4);
  return Math.round(Math.min(x,max)*k)/k;
}

function invLabel(t){const x=INV_TYPES.find(y=>y[0]===t);return x?x[1]:"Investment"}

function cleanInvest(r){
  const type=INV_TYPES.some(x=>x[0]===r.type)?r.type:"stock";
  return {id:r.id,type:type,name:str(r.name,80).trim(),sym:str(r.sym,12).trim().toUpperCase(),cgid:str(r.cgid,60).trim().toLowerCase(),at:num(r.at,0),
    metal:type==="metal"&&METALS.some(m=>m[0]===r.metal)?r.metal:(type==="metal"?"gold":""),
    qty:numP(r.qty,1e12,8),cost:numP(r.cost,1e10,4),price:numP(r.price,1e10,4),pp:numP(r.pp,1e10,4),balance:numIn(r.balance,1e12,true),rate:numIn(r.rate,100,true)};
}

function investValue(r){
  const q=Number(r.qty)||0;
  const pr=Number(r.price)||0;
  if(r.type==="collect"||r.type==="other")return (q>0?q:1)*pr;
  if(q>0&&pr>0)return q*pr;
  return Number(r.balance)||0;
}

function investPaid(r){
  const c=Number(r.cost)||0;
  if(!(c>0))return null;
  if(r.type==="collect"||r.type==="other")return (Number(r.qty)>0?Number(r.qty):1)*c;
  return Number(r.qty)>0?Number(r.qty)*c:null;
}

function assetTotals(){
  const cat={};
  ASSET_CATS.forEach(c=>{cat[c[0]]=0});
  Data.assets.forEach(a=>{cat[a.type==="home"?"home":"vehicle"]+=Number(a.value)||0});
  Data.invest.forEach(r=>{cat[r.type]+=investValue(r)});
  const total=ASSET_CATS.reduce((n,c)=>n+cat[c[0]],0);
  return {cat:cat,total:total,owed:acctTotals().owed};
}

function pieSvg(t){
  const R=56;
  const slices=ASSET_CATS.filter(c=>t.cat[c[0]]>0);
  if(slices.length===1){
    const c=slices[0];
    return '<svg class="pie" viewBox="0 0 120 120" role="img" aria-label="Pie chart of asset value by kind"><circle cx="60" cy="60" r="'+R+'" fill="'+c[2]+'"><title>'+esc(c[1])+": 100%</title></circle></svg>";
  }
  let a0=-Math.PI/2;
  const paths=slices.map(c=>{
    const frac=t.cat[c[0]]/t.total;
    const a1=a0+frac*Math.PI*2;
    const x0=60+R*Math.cos(a0),y0=60+R*Math.sin(a0),x1=60+R*Math.cos(a1),y1=60+R*Math.sin(a1);
    const d="M60 60 L"+x0.toFixed(2)+" "+y0.toFixed(2)+" A"+R+" "+R+" 0 "+(frac>.5?1:0)+" 1 "+x1.toFixed(2)+" "+y1.toFixed(2)+" Z";
    a0=a1;
    return '<path d="'+d+'" fill="'+c[2]+'"><title>'+esc(c[1])+": "+esc(moneyText(t.cat[c[0]]))+" ("+(frac*100).toFixed(1)+"%)</title></path>";
  });
  return '<svg class="pie" viewBox="0 0 120 120" role="img" aria-label="Pie chart of asset value by kind">'+paths.join("")+"</svg>";
}

const CG_IDS={btc:"bitcoin",eth:"ethereum",sol:"solana",ada:"cardano",xrp:"ripple",doge:"dogecoin",ltc:"litecoin",bnb:"binancecoin",dot:"polkadot",avax:"avalanche-2",link:"chainlink",usdt:"tether",usdc:"usd-coin",shib:"shiba-inu",trx:"tron",xlm:"stellar",atom:"cosmos",bch:"bitcoin-cash",matic:"matic-network",pol:"polygon-ecosystem-token",xmr:"monero",etc:"ethereum-classic",near:"near",uni:"uniswap"};
const METAL_SYM={gold:"XAU",silver:"XAG",platinum:"XPT",palladium:"XPD"};
const PRICE_EVERY={crypto:15*60000,stock:15*60000,metal:24*3600000};

const DEFAULT_KEYS={fin:"db3pna1r01qucqggq5q0db3pna1r01qucqggq5qg",met:"mc_live_9caab0f53712609e4da85bcf738b1ff144fbc212964607eab755c8c776603bb8",news:"pub_ab1648d232b342bba9d314be04755643"};

function priceKeys(){

  return {fin:DEFAULT_KEYS.fin,met:DEFAULT_KEYS.met};

function priceStamps(){

function fetchJson(url,opts,ms){
  const ctl=typeof AbortController==="function"?new AbortController():null;
  const timer=setTimeout(()=>{if(ctl)ctl.abort()},ms||10000);
  return fetch(url,Object.assign({},opts||{},ctl?{signal:ctl.signal}:{})).then(r=>{
    clearTimeout(timer);
    if(!r.ok){const e=new Error("http");e.status=r.status;throw e}
    return r.json();
  },e=>{clearTimeout(timer);throw e});
}

function setLive(r,v){
  if(Number(r.price)>0&&v!==Number(r.price))r.pp=Number(r.price);
  r.price=v;
  r.at=Date.now();
}

function priceErr(e){
  if(e&&e.status===401||e&&e.status===403)return "key rejected";
  if(e&&e.status===429)return "limit reached, try later";
  if(e&&e.status)return "error "+e.status;
  return "could not reach it (offline, blocked, or the site does not allow this page)";
}

async function refreshCrypto(){
  const recs=Data.invest.filter(r=>r.type==="crypto"&&Number(r.qty)>0);
  if(!recs.length)return null;
  for(const r of recs){
    if(!r.cgid){
      const key=(r.sym||"").toLowerCase();
      const byName=String(r.name||"").toLowerCase().trim();
      r.cgid=CG_IDS[key]||CG_IDS[byName]||"";
      if(!r.cgid){
        const j=await fetchJson("https://api.coingecko.com/api/v3/search?query="+encodeURIComponent(r.sym||r.name));
        const c=j&&Array.isArray(j.coins)&&j.coins[0];
        if(c&&typeof c.id==="string")r.cgid=c.id.slice(0,60);
      }
    }
  }
  const ids=[...new Set(recs.map(r=>r.cgid).filter(Boolean))];
  if(!ids.length)return "0 of "+recs.length+" (coin not found)";
  const j=await fetchJson("https://api.coingecko.com/api/v3/simple/price?vs_currencies=usd&ids="+encodeURIComponent(ids.join(",")));
  let n=0;
  recs.forEach(r=>{
    const v=j&&j[r.cgid]&&j[r.cgid].usd;
    if(typeof v==="number"&&v>0){setLive(r,v);n++}
  });
  return n+" of "+recs.length;
}

async function refreshStocks(){
  const recs=Data.invest.filter(r=>(r.type==="stock"||r.type==="retire")&&r.sym&&Number(r.qty)>0);
  if(!recs.length)return null;
  const key=priceKeys().fin;
  if(!key)return "needs a Finnhub key in Settings";
  const syms=[...new Set(recs.map(r=>r.sym))].slice(0,25);
  const got={};
  for(const sy of syms){
    const j=await fetchJson("https://finnhub.io/api/v1/quote?symbol="+encodeURIComponent(sy)+"&token="+encodeURIComponent(key));
    if(j&&typeof j.c==="number"&&j.c>0)got[sy]=j.c;
  }
  let n=0;
  recs.forEach(r=>{if(got[r.sym]){setLive(r,got[r.sym]);n++}});
  return n+" of "+recs.length;
}

async function refreshMetals(){
  const recs=Data.invest.filter(r=>r.type==="metal"&&Number(r.qty)>0);
  if(!recs.length)return null;
  const key=priceKeys().met;
  if(!key)return "needs a MetalCharts key in Settings";
  const j=await fetchJson("https://api.metalcharts.org/v1/prices",{headers:{Authorization:"Bearer "+key}});
  const d=j&&j.data;
  let n=0;
  recs.forEach(r=>{
    const e=d&&d[METAL_SYM[r.metal]];
    if(e&&typeof e.price==="number"&&e.price>0){setLive(r,Math.round(e.price*10000)/10000);n++}
  });
  return n+" of "+recs.length;
}

async function refreshPrices(force){
  if(PriceUI.busy)return;
  const st=priceStamps();
  const now=Date.now();
  const jobs=[["crypto","Crypto",refreshCrypto],["stock","Stocks",refreshStocks],["metal","Metals",refreshMetals]].filter(j=>force||now-(st[j[0]]||0)>=PRICE_EVERY[j[0]]);
  if(!jobs.length)return;
  PriceUI.busy=true;
  if($("asRefresh")){$("asRefresh").disabled=true;$("asRefresh").textContent="Refreshing..."}
  const parts=[];
  for(const j of jobs){
    try{
      const r=await j[2]();
      if(r!==null){
        parts.push(j[1]+": "+r);
        if(/^\d/.test(r)){st[j[0]]=Date.now()}
      }
    }catch(e){
      parts.push(j[1]+": "+priceErr(e));
    }
  }
  Store.set("priceStamp",st);
  Data.save("invest");
  PriceUI.busy=false;
  if(currentTab==="bridge")renderBridge();
  PriceUI.msg=parts.length?parts.join(" · "):"Nothing to look up. Add a stock, crypto or metal with an amount first.";
  renderAssets();
}

function buildAssets(){
  $("view-assets").innerHTML='<div class="cols"><div class="panel"><h2>Assets <span id="asCount" style="color:var(--dim);letter-spacing:.1em"></span></h2>'+
    '<p class="hint">Press the + button to add a vehicle, home, investment or account. Values are typed in by you. Vehicles and homes create maintenance and payment tasks from the dates you enter.</p><div id="asSum"></div><div class="row" style="margin-top:12px"><button type="button" class="btn" id="asRefresh">Refresh Prices</button></div><div class="msg" id="asPriceMsg" role="status"></div></div>'+

  $("asRefresh").addEventListener("click",()=>{Sound.play("click");PriceUI.msg="";refreshPrices(true)});
  $("view-assets").addEventListener("click",e=>{
    const ie=e.target.closest("[data-iedit]");
    if(ie){Sound.play("click");openPopup("investedit",ie.dataset.iedit);return}
    const idl=e.target.closest("[data-idel]");
    if(idl){
      const id=idl.dataset.idel;
      if(Armed.hit("iv:"+id,renderAssets)){
        const i=Data.invest.findIndex(x=>x.id===id);
        if(i>=0)Data.invest.splice(i,1);
        Data.save("invest");
        Sound.play("remove");
      }else{
        Sound.play("click");
      }
      renderAssets();
      return;
    }
    const bb=e.target.closest("[data-buybought]");
    if(bb){
      const i=Data.tobuy.findIndex(x=>x.id===bb.dataset.buybought);
      if(i<0)return;
      const it=Data.tobuy[i];
      Data.tobuy.splice(i,1);
      Data.save("tobuy");
      Sound.play("confirm");
      renderAssets();
      openPopup("asset");
      $("modalBody").insertAdjacentHTML("afterbegin",'<p class="hint">You bought: <b>'+esc(it.name)+"</b>"+(it.price!==""?" (estimated "+esc(moneyText(it.price))+")":"")+". It was taken off the To Buy list. Choose what kind of asset to add it as, or Cancel to skip.</p>");
      return;
    }
    const be=e.target.closest("[data-buyedit]");
    if(be){Sound.play("click");openPopup("tobuyedit",be.dataset.buyedit);return}
    const bd=e.target.closest("[data-buydel]");
    if(bd){
      const id=bd.dataset.buydel;
      if(Armed.hit("by:"+id,renderAssets)){
        const i=Data.tobuy.findIndex(x=>x.id===id);
        if(i>=0)Data.tobuy.splice(i,1);
        Data.save("tobuy");
        Sound.play("remove");
      }else{
        Sound.play("click");
      }
      renderAssets();
      return;
    }
    const ed=e.target.closest("[data-aedit]");
    if(ed){
      Sound.play("click");
      const ea=Data.assets.find(x=>x.id===ed.dataset.aedit);
      openPopup(ea&&ea.type==="home"?"homeedit":"vehicleedit",ed.dataset.aedit);
      return;
    }
    const dl=e.target.closest("[data-adel]");
    if(dl){
      const id=dl.dataset.adel;
      if(Armed.hit("as:"+id,renderAssets)){
        const i=Data.assets.findIndex(x=>x.id===id);
        if(i>=0)Data.assets.splice(i,1);
        Data.todos=Data.todos.filter(t=>t.done||t.asset!==id);
        Data.save("assets");
        Data.save("todos");
        Sound.play("remove");
        renderAssets();

      }else{
        Sound.play("click");
        renderAssets();
      }
    }
  });

}

}

function billMonthly(b){
  const a=Number(b.amount)||0;
  const m=b.per==="year"?a/12:b.per==="week"?a*52/12:a;
  return Math.round(m*100)/100;
}

function debtInterest(x){
  return Math.round((Number(x.balance)||0)*(Number(x.rate)||0)/1200*100)/100;
}

function acctTotals(){
  const cat={};
  BILL_KINDS.forEach(k=>{cat[k[0]]=0});
  Data.bills.forEach(b=>{cat[b.kind]=(cat[b.kind]||0)+billMonthly(b)});
  const bills=BILL_KINDS.reduce((n,k)=>n+cat[k[0]],0);
  const loans=Data.assets.filter(a=>a.loan>0&&a.pay>0);
  const loanPay=loans.reduce((n,a)=>n+Number(a.pay),0);
  const debtPay=Data.debts.reduce((n,x)=>n+(Number(x.pay)||0),0);
  const owed=Data.debts.reduce((n,x)=>n+(Number(x.balance)||0),0)+Data.assets.reduce((n,a)=>n+(Number(a.loan)||0),0);
  const interest=Data.debts.reduce((n,x)=>n+debtInterest(x),0)+Data.assets.reduce((n,a)=>n+(a.type==="home"?0:debtInterest({balance:a.loan,rate:a.rate})),0);
  const mortgageInterest=Data.assets.reduce((n,a)=>n+(a.type==="home"?debtInterest({balance:a.loan,rate:a.rate}):0),0);
  return {cat:cat,bills:bills,loans:loans,loanPay:loanPay,debtPay:debtPay,owed:owed,interest:interest,mortgageInterest:mortgageInterest,monthly:bills+loanPay+debtPay};
}

function buildAccounting(){
  $("view-accounting").innerHTML='<div class="cols"><div class="panel"><h2>Accounting <span id="acCount" style="color:var(--dim);letter-spacing:.1em"></span></h2>'+
    '<p class="hint">Estimated monthly bills and what you owe. Press the + button to add one. Amounts are your own estimates.</p><div id="acSum"></div></div>'+

    '<div class="panel"><h2>Credit Cards and Loans</h2><div class="pgrid" id="acDebts"></div></div></div>';
  $("view-accounting").addEventListener("click",e=>{
    const be=e.target.closest("[data-bedit]");
    const bd=e.target.closest("[data-bdel]");
    const de=e.target.closest("[data-dedit]");
    const dd=e.target.closest("[data-ddel]");
    if(be){Sound.play("click");openPopup("billedit",be.dataset.bedit);return}
    if(de){Sound.play("click");openPopup("debtedit",de.dataset.dedit);return}
    if(bd||dd){
      const id=(bd||dd).dataset[bd?"bdel":"ddel"];
      if(Armed.hit((bd?"bl:":"db:")+id,renderAccounting)){
        const list=bd?Data.bills:Data.debts;
        const i=list.findIndex(x=>x.id===id);
        if(i>=0)list.splice(i,1);
        Data.save(bd?"bills":"debts");
        Sound.play("remove");
      }else{
        Sound.play("click");
      }
      renderAccounting();
    }
  });
  renderAccounting();
}

const NEWS_CATS=[["top","Breaking News"],["","All topics"],["business","Business"],["technology","Technology"],["science","Science"],["politics","Politics"],["world","World"]];
const NEWS_BANNED=["sports","health","environment","entertainment"];
const NEWS_SHOW=5;
const NEWS_EXTRA={crime:"🚔",domestic:"🏠",education:"🎓",food:"🍽️",lifestyle:"🧭",tourism:"🧳",other:"📰"};
function newsEmoji(c){return NEWS_EXTRA[c]||icon("news",NEWS_CATS.some(x=>x[0]===c)?c:"")||"📰"}

  const v=Store.get("newsPrefs",{});

  let k=v&&typeof v.category==="string"&&NEWS_CATS.some(x=>x[0]===v.category)?v.category:"top";
  if(Store.get("newsBreaking",false)!==true){
    Store.set("newsBreaking",true);
    if(k==="")k="top";
  }
  return {q:v&&typeof v.q==="string"?v.q.slice(0,80):"",country:c,category:k,busy:false,msg:"",stale:false};
})();
const NEWS_FRESH=30*60000;

function newsCache(){
  const v=Store.get("newsCache5",{});
  return v&&typeof v==="object"&&!Array.isArray(v)?v:{};
}

function newsKeyStr(){return [NewsUI.q.toLowerCase(),NewsUI.country,NewsUI.category].join("|")}

function newsAgo(p){
  if(!p)return "";
  let t=String(p);
  if(/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(t))t=t.replace(" ","T")+"Z";
  const d=new Date(t);
  if(isNaN(d.getTime()))return "";
  const m=Math.round((Date.now()-d.getTime())/60000);
  if(m<1)return "just now";
  if(m<60)return m+" min ago";
  if(m<1440)return Math.round(m/60)+" h ago";
  return d.toLocaleDateString([],{month:"short",day:"numeric"});
}
